# rooms: id, title, description (block scalar), exits, score (D3, N8)
rooms:
  - id: room-network-hub
    title: The Network Hub
    aliases: [patch bay, broadcast bay, concourse]
    description: >-
      You stand in a hub older than the rest of the machine. A yellowed label
      says it has been here since the 1990s. It copies everything to every
      port, so all routes show at once: one live, the rest dark. The AI says
      the hub is on the record, so nobody switched it off. Only the east port
      is live, towards the Switchyard; west returns to arrival, and in to the
      interface. The AI waits for you to choose.
    topicIds: []
    exits:
      - direction: west
        to: room-arrival
      - direction: east
        to: room-switch-floor
      - direction: in
        to: room-entry-interface
    score: 0
    authoring:
      interesting: Every route shows at once, yet only the east port carries a signal.
      note: Navigation-only zone-choice starting point; no teaching topic is scoped here (P1).

