# area card for network-hub
# Applicable rules: D2, D3, D4, N6, V1
# Rules in scope for this brief: N1, N3, N4, N5, N6, N8, P1, D2, D3, D4, D5, V1
kind: area
areaId: network-hub
status: approved

definition:
  id: area-network-hub
  worldId: world-wjec-gcse-computer-science-2025-spec
  name: The Network Hub
  startRoomId: room-network-hub
  lives: 3

# A world is declared once, by the area whose startAreaId it names (D3).
# This area is not that owner: it sets only definition.worldId and omits worlds.

# rooms: id, title, description (block scalar), exits, score (D3, N8)
rooms:
  - id: room-network-hub
    title: The Network Hub
    aliases: [patch bay, broadcast bay]
    description: >-
      Around you, brass sockets crowd the hub, each with a little label, all
      humming one low note. A yellowed card reads 'since the 1990s' in fading
      ink. The hub copies every packet to every port, so all routes show at
      once: two bright, the rest dark. The AI calls it 'on the record'; nobody
      unplugged it. A port label on the east socket reads LIVE; that route goes
      to the Switchyard. A fresh paper label on the north socket reads THE RULE
      MACHINE; north goes to the rule quarters and the mill beyond them. West
      leads to arrival; in, to the interface.
    topicIds: []
    exits:
      - direction: west
        to: room-arrival
      - direction: east
        to: room-switch-floor
      - direction: in
        to: room-entry-interface
      - direction: north
        to: room-1-4-concourse
    score: 0
    authoring:
      interesting: >-
        A bank of humming sockets under worn little labels; every route shows
        at once, yet two ports carry a signal: the east socket labelled LIVE
        and the north socket under a fresh paper label. The rest sit dark.
      note: Navigation-only zone-choice starting point; no teaching topic is scoped here (P1).

# items: id, name, aliases, portable, description, initialRoom (D2, D3)
items:
  - id: item-port-label
    name: port label
    aliases: [port label, live port]
    portable: false
    description: >-
      A small port label fixed to the east socket, its paper yellowed at the
      corners. LIVE is stamped across it in block capitals, the ink rubbed pale
      by old fingers. The AI has initialled one corner in blue pen, the way it
      signs a verdict. It will not come away.
    initialRoom: room-network-hub
    authoring:
      useNotes: >-
        Purely decorative and examinable only. EXAMINING the port label sets no
        flag and opens no gate; it simply lets you read the worn LIVE stamp. The
        label is fixed to its socket, so it is never a required item.
