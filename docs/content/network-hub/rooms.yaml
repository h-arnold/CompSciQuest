# area card for network-hub
# Applicable rules: D2, D3, D4, N6, V1
# Rules in scope for this brief: N1, N3, N4, N5, N6, N8, P1, D2, D3, D4, D5, V1
kind: area
areaId: network-hub
status: approved

definition:
  id: area-network-hub
  worldId: world-wjec-gcse-computer-science-2025-spec
  name: The Network Hub
  startRoomId: room-network-hub
  lives: 3

# A world is declared once, by the area whose startAreaId it names (D3).
# This area is not that owner: it sets only definition.worldId and omits worlds.

# rooms: id, title, description (block scalar), exits, score (D3, N8)
rooms:
  - id: room-network-hub
    title: The Network Hub
    aliases: [patch bay, broadcast bay]
    description: |
      Around you, brass sockets crowd the hub, each with a little label, all
      humming one low note. A yellowed card reads 'since the 1990s' in fading
      ink. The hub copies every packet to every port, so every route shows at
      once. ***The AI*** calls it 'on the record'; nobody unplugged it.

      South opens into the Assistance Ward. The east and north teaching sockets
      are dark until the ward's calibration mark is on record, and carry traffic
      once it is; their labels carry the same notice. A **port label** clings to
      the east socket; *east* leads to the Switchyard. A **patch-bay legend** is
      clipped to the frame above the sockets. A fresh paper label on the north
      socket reads THE RULE MACHINE; *north* leads to the rule quarters and the
      mill beyond them. *west* leads to arrival; *in*, to the interface.
    topicIds: []
    exits:
      - direction: west
        to: room-arrival
      - direction: east
        to: room-switch-floor
        conditions:
          - { kind: flag-set, flag: tutorial-complete }
        blockedText: >-
          The east socket gives no signal. Its label names the ward mark that
          must be recorded before this route carries traffic.
      - direction: in
        to: room-entry-interface
      - direction: north
        to: room-1-4-concourse
        conditions:
          - { kind: flag-set, flag: tutorial-complete }
        blockedText: >-
          The north socket gives no signal. It carries traffic once the ward's
          calibration mark is on record.
      - direction: south
        to: room-assistance-intake
    score: 0
    authoring:
      interesting: >-
        A worn bank of labelled sockets hums beneath the AI's 'on the record'
        boast. The north label points to the Rule Machine, the south route
        stands open, and the east and north teaching sockets wait for the
        Assistance Ward's calibration mark.
      note: Navigation-only zone-choice starting point; no teaching topic is scoped here (P1).

# items: id, name, aliases, portable, description, initialRoom (D2, D3)
items:
  - id: item-port-label
    name: port label
    aliases: [port label, live port]
    portable: false
    description: >-
      A small port label fixed to the east socket, its paper yellowed at the
      corners. LIVE is stamped across it in block capitals, the ink rubbed pale
      by old fingers. Below it, a newer line reads TEACHING PORTS: LIVE AFTER
      ASSISTANCE WARD CALIBRATION. The AI has initialled one corner in blue pen,
      the way it signs a verdict. It will not come away.
    initialRoom: room-network-hub
    authoring:
      useNotes: >-
        Purely decorative and examinable only. EXAMINING the port label sets no
        flag and opens no gate; it simply lets you read the worn LIVE stamp and
        the Assistance Ward calibration notice. The label is fixed to its
        socket, so it is never a required item.
  - id: item-patch-bay-legend
    name: patch-bay legend
    aliases: [legend, port legend, patch legend, patch bay legend]
    portable: false
    description: |
      A card pinned beside the sockets sets out each port, its label and its light.

      | Port | Label | State |
      | --- | --- | --- |
      | west | ARRIVAL | dark |
      | east | LIVE | bright |
      | in | INTERFACE | dark |
      | north | THE RULE MACHINE | bright |
    initialRoom: room-network-hub
    authoring:
      useNotes: >-
        Purely decorative and examinable only. The table restates the port labels
        and lights already visible in the room; it sets no flag, opens no gate and
        carries no score or course fact. It exists to exercise table rendering in
        the pilot.
