kind: hazard
areaId: 1-2-1-data-representation
status: approved
topicIds: [switch-to-bit, number-conversion, data-storage-units, character-representation, data-types]

hazards:
  - id: hazard-switch-overheat
    trigger: { kind: on-room-enter, roomId: room-switch-floor }
    when: { kind: not, of: { kind: flag-set, flag: switch-cooled } }
    effects:
      - { kind: message, text: "Heat haze curls off the belt and the clicks run together into one shrill whine. The foreman claps a hand over his ears and mutters about paperwork as the switches cook; you are back in the hall, one life lighter." }
      - { kind: change-lives, delta: -1, reason: "the switch belt overheated" }
      - { kind: move-player, roomId: room-binary-hall, reason: "returned to the level start after the switch belt overheated" }
    once: true
    authoring:
      telegraph: >-
        H1 — in `room-switch-floor` description: "Heat haze shimmers off a belt of tiny black switches, and the clicks are getting faster." Read on entry before the trigger fires; room-entry hazards fire after the initial room text (hazards.md §8).
      counterplay: >-
        The first entry costs one life and returns you to the level start (`room-binary-hall`). Because `once: true` limits it to a single firing, a subsequent entry is safe: USE the switch gauge on the belt (`item-switch-gauge` useNotes) sets `switch-cooled`, which disarms this hazard and opens the way onward. Staying out of the room also avoids the penalty.
      pillar: >-
        P-b, P-d — a switch is a physical machine part, delivered deadpan.

  - id: hazard-carry-overflow
    trigger: { kind: on-room-enter, roomId: room-hex-deck }
    when: { kind: not, of: { kind: flag-set, flag: carry-cleared } }
    effects:
      - { kind: message, text: "The carry lamp drips another spare 1 into the tin tray scratched OVERFLOW and the sum runs off the end of the column with nowhere left to go. The nibble clerk goes pale behind their abacus and whispers 'Columns of four'; you are back at the hall door, one life spent." }
      - { kind: change-lives, delta: -1, reason: "the carry overflowed into the OVERFLOW tray" }
      - { kind: move-player, roomId: room-binary-hall, reason: "returned to the level start after the carry overflowed" }
    once: true
    authoring:
      telegraph: >-
        H1 — in `room-hex-deck` description: "A stuck carry lamp drips 1s into an OVERFLOW tray." The lamp is also named in the room's interesting note. Read on entry before the trigger fires; room-entry hazards fire after the initial room text.
      counterplay: >-
        The first entry costs one life and returns you to the level start (`room-binary-hall`). Because `once: true` limits it to a single firing, a subsequent entry is safe: USE the nibble card on the carry lamp (`item-hex-nibble-card` useNotes) sets `carry-cleared`, which disarms this hazard and opens the way onward. Staying out of the room also avoids the penalty.
      pillar: >-
        P-b, P-c — arithmetic is a track with moving parts; reading it opens the next layer.

  - id: hazard-bit-rot
    trigger: { kind: on-room-enter, roomId: room-storage-stacks }
    when: { kind: not, of: { kind: flag-set, flag: stacks-sealed } }
    effects:
      - { kind: message, text: "A label curls off the rung in your hand and drifts down through the dry, dusty air. Somewhere in the stacks a crate forgets what it holds. The keeper drops their ledger and starts counting the dust; you are back at the hall door, one life gone." }
      - { kind: change-lives, delta: -1, reason: "bit rot flaked the storage stack labels" }
      - { kind: move-player, roomId: room-binary-hall, reason: "returned to the level start after bit rot on the stacks" }
    once: true
    authoring:
      telegraph: >-
        H1 — in `room-storage-stacks` description: "The labels flake at the corners, and the air is dry and dusty." The stack keeper also telegraphs the rot in dialogue (cast note, topic file §4: `npc-stack-keeper` "telegraphs `hazard-bit-rot` in dialogue"). Read on entry before the trigger fires.
      counterplay: >-
        The first entry costs one life and returns you to the level start (`room-binary-hall`). Because `once: true` limits it to a single firing, a subsequent entry is safe: the stack keeper's NPC topic owns the editor-assigned flag `stacks-sealed` ("seal shelves against bit rot", topic file §7), which disarms this hazard; the NPC card is the owner, so no new flag is invented here. Staying out of the room also avoids the penalty.
      pillar: >-
        P-b, P-c — capacity is a physical chain of shelves; keeping it sealed opens the press.

  - id: hazard-glyph-corruption
    trigger: { kind: on-item-used, itemId: item-ascii-stamp }
    when: { kind: not, of: { kind: flag-set, flag: tiles-verified } }
    effects:
      - { kind: message, text: "Grey dust puffs from the stamp's grooves and the corner of a glyph crumbles under your hand. The typesetter lays a finger over the chipped tile and murmurs that every mark has its place; you are back in the hall, one life down." }
      - { kind: change-lives, delta: -1, reason: "a glyph corrupted under the dusty stamp" }
      - { kind: move-player, roomId: room-binary-hall, reason: "returned to the level start after a glyph corrupted" }
    authoring:
      telegraph: >-
        H1 — in `room-character-tiles` description: "One tile has lost the corner of its glyph. Grey dust coats the stamp." The `item-ascii-stamp` description repeats "Grey dust sits in the grooves." Both are read on entry, before the stamp is used.
      counterplay: >-
        EXAMINE the tiles in the character case before using the stamp (`item-ascii-stamp` useNotes) sets `tiles-verified`, which disarms this hazard; leaving the stamp alone also avoids it. The flag bounds repeat damage, so no cooldown is needed.
      pillar: >-
        P-b, P-c — a character set is a physical case of marks; matching them opens the gallery.

  - id: hazard-detention-bell
    trigger: { kind: on-item-used, itemId: item-comic-sans-cartridge }
    when: { kind: visited-room, roomId: room-binary-hall }
    effects:
      - { kind: message, text: "The cartridge hums warm in your hand, almost smug. A detention bell clangs and the ledger logs a compliance infringement in your name. The AI's voice comes over the floor, flat as a stamped form; you are back in the hall, one life poorer." }
      - { kind: change-lives, delta: -1, reason: "unauthorised font use rang the detention bell" }
      - { kind: move-player, roomId: room-binary-hall, reason: "returned to the level start after the detention bell" }
    once: true
    authoring:
      telegraph: >-
        H1 — in `room-binary-hall` description: "A comic sans cartridge warms and hums; its notice reads 'Unauthorised font use is a compliance infringement'." The `item-comic-sans-cartridge` description repeats the warm hum and the handwritten notice. Read before the cartridge is used.
      counterplay: >-
        Avoidable — the cartridge is expendable and required by no puzzle (topic file §3; `item-comic-sans-cartridge` useNotes), so leaving it unused sidesteps the hazard entirely; `once: true` bounds a single careless use.
      pillar: >-
        P-a, P-d — the AI's "compliance" framing and deadpan cartoon school absurdity.
