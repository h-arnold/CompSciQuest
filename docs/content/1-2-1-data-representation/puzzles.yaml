kind: puzzle
areaId: 1-2-1-data-representation
status: approved
topicIds: [data-types, number-conversion, character-representation, graphics-representation, sound-representation, data-storage-units, data-compression]

puzzles:
  - id: puzzle-sort-the-data-types
    requirements: [{ kind: flag-set, flag: types-sorted }]
    onSolve: [{ kind: complete-topic, topicId: data-types }]
    topicId: data-types
    score: 1
    hintSequenceId: hint-data-types
    dependsOn: []
    authoring:
      pillar: >-
        P-b, P-c — the five types are physical bins; one correct filing opens the next floor.
      task: >-
        You take the sixth sample, marked with a decimal value, and file it in the bin whose characteristic fits. The bins already hold a Boolean condition, a single letter, a whole number, a temperature and an email; the whole-number bin keeps age 15, while the temperature bin's own label carries a decimal point. That label is your cue. (authoring) The five type labels and their examples are the spec's own list (§1.2.1); its `real` example is a temperature of 36.4.
      producedBy: >-
        `PUT the sample on the matching bin` sets `types-sorted`; owner: the type bins fixture in `room-binary-hall` (topic file §3.1). `put` is a canonical verb (application-and-ui §5.1).
      clues:
        - >-
          `room-binary-hall` description: "Five type bins: "if Valid = True", letter "A", age 15, temperature 36.4, email "computer.science@wjec.co.uk"; a sixth unlabelled decimal sample has no bin name." The five labels are the specification's own examples of Boolean, character, integer, real and string (§1.2.1), and "temperature 36.4" is its `real` example.
        - >-
          `room-binary-hall` type bins fixture (editor correction 2026-11-24, topic file §3.1; real source): the sixth item is an unlabelled sample bearing a decimal value; it belongs to one of the five types, and its characteristic points to the `real` bin beside the temperature 36.4.
        - >-
          `hint-data-types` level 2 (real source): a Boolean holds a True/False condition, a character is a single number, letter or symbol, an integer is a whole number, a real is a number with a decimal point, and a string is a run of characters. The foreman's `topic-foreman-lift` response gives the same five labels in brief ("Boolean for a switch state, character for one letter, integer for a whole number, real for a decimal, string for a run of characters"), so the definitions are placed, not assumed.

  - id: puzzle-set-the-switches
    requirements: [{ kind: flag-set, flag: switches-set }]
    onSolve: [{ kind: complete-topic, topicId: number-conversion }]
    topicId: number-conversion
    score: 1
    hintSequenceId: hint-number-systems
    dependsOn: []
    authoring:
      pillar: >-
        P-b, P-c — each switch is a bit, and setting the line opens the north arch.
      task: >-
        You read the denary value on the gauge and set the belt to its binary pattern so the hall's north arch opens. The stair above the belt stays shut under a push; the arch responds to the converted value held by the switches. (authoring) This exercises the spec verb "convert between denary, binary and hexadecimal" (L534–536) with the spec's own worked value (L598). The converted pattern is the key you work out, so no clue prints it.
      producedBy: >-
        `USE the switch gauge on the belt of tiny black switches` sets `switches-set`; the action wording comes from `item-switch-gauge` useNotes, where the same action also sets `switch-cooled`. The editor's re-brief adds the denary 37 marking (topic file §3.1). Flag names stay as recorded.
      clues:
        - >-
          `item-switch-gauge` description (editor re-brief recorded in topic file §3.1; real source): its stamped line reads "SET EVERY SWITCH, THEN TAKE THE NORTH STAIR", a small dial marked COOL is stuck at red, and a stamped tab asks "denary 37 — what binary pattern?" The tab offers a denary value for you to convert into the switch pattern.
        - >-
          `room-switch-floor` description: "Each switch is a transistor — a tiny switch that decides whether a line carries a one or a zero." The belt stores binary digits, so the denary marking must be converted before the switches can be set.
        - >-
          `hint-number-systems` level 2 (real source): "Write a place-value row under the digits: powers of two for binary ... work from the right and fill one group at a time." That place-value method builds the switch pattern, and no result is printed. The divide-by-2 / record-the-remainder / reverse-the-order wording attributed to `topic-foreman-switches` / `node-foreman-switch-lesson` is a candidate placement: neither card carries it, `node-foreman-switch-lesson` is reserved and never entered, and it is not counted toward the two-clue gate. The only card text with that divide-by-2 procedure is `quiz-number-systems` q-dr-08's explanation, which prints 100101 and opens after this gate, so it is not used here.
        - >-
          `room-binary-hall` description and painted route diagram: "A painted route diagram names each gate: north switches-set, east hex-read, south characters-matched, up picture-built, in sound-sampled, out stacks-sorted. The arches repeat: switches, nibbles, tiles, image, sound, stacks." The north pair is the one for this gate.

  - id: puzzle-add-with-carries
    requirements: [{ kind: flag-set, flag: carries-added }]
    onSolve: [{ kind: complete-topic, topicId: number-conversion }]
    topicId: number-conversion
    score: 1
    hintSequenceId: hint-number-systems
    dependsOn: [puzzle-set-the-switches]
    authoring:
      pillar: >-
        P-b, P-c — binary addition is a track with moving parts, and doing it accurately moves you on.
      task: >-
        With the north arch open, you work the carry track so the rightmost column adds correctly. The painted rule reads 1 + 1 = 0 with a carry of 1, so the chained token has a second column to visit.
      producedBy: >-
        `USE the carry token on the rightmost column` sets `carries-added`; owner: the carry track fixture in `room-hex-deck` (topic file §3.1).
      clues:
        - >-
          `room-hex-deck` description: "A carry track reads "1 + 1 = 0, carry 1"; a token waits at the rightmost column."
        - >-
          `npc-nibble-clerk` dialogue `topic-clerk-carries` (real source): a carry is passed to the next column, taught as method only; §1.2.1 gives the rule 1 + 1 = 10 (0 with a carry of 1).
        - >-
          `item-hex-nibble-card` description: "A hollow at the top fits the carry token" — the token has a named resting place on the card.

  - id: puzzle-shift-the-row
    requirements: [{ kind: flag-set, flag: row-shifted }]
    onSolve: [{ kind: complete-topic, topicId: number-conversion }]
    topicId: number-conversion
    score: 1
    hintSequenceId: hint-number-systems
    dependsOn: [puzzle-add-with-carries]
    authoring:
      pillar: >-
        P-b, P-c — an arithmetic shift is a physical row you move, and explaining its effect is the gate.
      task: >-
        You work the shift gutter in the direction the arrow notches indicate and name the effect of the shift. The lever moves the row, while the card beside it sets out what a left shift and a right shift do; the effect is yours to report. (authoring) The effect is qualitative only: §1.2.1 has no worked shift or overflow numbers, so no numeric result is asserted.
      producedBy: >-
        `USE the shift lever on the row` sets `row-shifted`; owner: the shift gutter fixture in `room-hex-deck` (topic file §3.1). That fixture carries the brief's spec-check flag: teach the effect, assert no number.
      clues:
        - >-
          `room-hex-deck` description: "Arrow notches and a lever line the shift gutter; its rule card reads: left shift multiplies by a multiple of 2, right shift divides by a multiple of 2; a bit past the end is overflow."
        - >-
          `npc-nibble-clerk` dialogue `topic-clerk-shifts` (real): "An arithmetic shift moves the row the way the notch points"; he asks you to decide what overflow and underflow do, and states no multiply/divide rule. The multiplication and division wording is on the room's shift-gutter rule card quoted in the first clue, so the clerk line is not its source and adds no worked result.

  - id: puzzle-read-nibbles
    requirements: [{ kind: flag-set, flag: hex-read }]
    onSolve: [{ kind: complete-topic, topicId: number-conversion }]
    topicId: number-conversion
    score: 1
    hintSequenceId: hint-number-systems
    dependsOn: [puzzle-set-the-switches]
    authoring:
      pillar: >-
        P-b, P-c — hexadecimal is a case of groups of four, and reading it opens the east door.
      task: >-
        You read the nibble card's groups of four so the east door opens. The card keeps its squares in fours, one group per line, so a long string of digits has a natural place to stop.
      producedBy: >-
        `USE the nibble card on the nibble groups` sets `hex-read`; owner: `item-hex-nibble-card` useNotes and the nibble groups in `room-hex-deck` (accepted `rooms.md`; topic file §3.1).
      clues:
        - >-
          `item-hex-nibble-card` description: "A card divided into nibble groups of four squares, one group per line. Its back is stamped READ THE NIBBLES BEFORE THE EAST DOOR OPENS."
        - >-
          `room-hex-deck` description: "A carry track reads "1 + 1 = 0, carry 1"; a token waits at the rightmost column." The card's four-square groups are the reading frame here, and the east arch in `room-binary-hall` repeats "nibbles".
        - >-
          `npc-nibble-clerk` dialogue `topic-clerk-bases` (candidate placement, not in the card and not counted): the response teaches "Columns of four" and the three bases but prints no worked grouping. The worked `10100101` → `1010` (A) and `0101` (5) → `A5` example is in `quiz-number-systems` q-dr-09's explanation, which opens after this gate; the counted clues are the card's four-square groups and its stamped back.
        - >-
          `room-binary-hall` painted route diagram and east arch: "east hex-read"; "The arches repeat: switches, nibbles, tiles, image, sound, stacks."

  - id: puzzle-match-characters
    requirements: [{ kind: flag-set, flag: characters-matched }]
    onSolve: [{ kind: complete-topic, topicId: character-representation }]
    topicId: character-representation
    score: 1
    hintSequenceId: hint-representation
    dependsOn: [puzzle-read-nibbles]
    authoring:
      pillar: >-
        P-b, P-c — a character set is a case of marks, and matching them opens the gallery.
      task: >-
        You match the tiles in the character case so the south door opens. Each tile holds a single mark, so a whole word needs a sequence of tiles; the case shows that distinction before you stamp.
      producedBy: >-
        `USE the ascii stamp on the tiles in the character case` sets `characters-matched`; owner: `item-ascii-stamp` useNotes and the tiles in the character case in `room-character-tiles` (accepted `rooms.md`; topic file §3.1). Verify the tiles first: using the stamp before verification triggers `hazard-glyph-corruption`.
      clues:
        - >-
          `item-ascii-stamp` description: "A wooden stamp with a character list on its case lid: "ASCII and Unicode: standardised character sets." The case is scratched MATCH THE TILES, THEN GO SOUTH."
        - >-
          `room-character-tiles` description: "A character case lies open, each tile holding a single mark."
        - >-
          `npc-the-typesetter` dialogue `topic-setter-ascii` (real source): one symbol versus a word — character versus string — the fully spec-backed distinction (§1.2.1).

  - id: puzzle-build-mosaic
    requirements: [{ kind: flag-set, flag: picture-built }]
    onSolve: [{ kind: complete-topic, topicId: graphics-representation }]
    topicId: graphics-representation
    score: 1
    hintSequenceId: hint-representation
    dependsOn: [puzzle-match-characters]
    authoring:
      pillar: >-
        P-b, P-c — stored pixels become a buildable image, and building it opens the choir.
      task: >-
        You build the image from its stored squares so the up stair opens. The room's label measures colour depth in bits per channel: 8 bits for each of R, G and B makes 24 bits per pixel, so one square carries more than a single bit.
      producedBy: >-
        `USE the pixel lens on the mosaic` sets `picture-built`; owner: `item-pixel-lens` useNotes and the mosaic in `room-picture-mosaic` (accepted `rooms.md`; topic file §3.1).
      clues:
        - >-
          `item-pixel-lens` description: "A glass lens in a cork holder, ground with a fine square grid. Through it, the mosaic squares turn into a tidy row of numbers. Its cap reads BUILD THE IMAGE, THEN CLIMB."
        - >-
          `room-picture-mosaic` description: "A vector sheet in the drafting corner shows curves scaling cleanly; a pixel grid squares off, and a mosaic ruler marks width and height. A label states: bit depth is the number of bits used for the colour of each pixel; colour depth is measured in bits per channel, or bpc."
        - >-
          `quiz-graphics-representation` q-dr-19 explanation (real quiz key; it opens later than this gate): the worked image is 1920 × 1080 at 24 bits per pixel, giving 2,073,600 pixels and 49,766,400 bits, with 6,220,800 bytes after dividing by eight. `npc-mosaic-critic` dialogue `topic-critic-storage` is a candidate placement, not in the card and not counted: it gives the method ("price the grid by its depth, then account for the missing squares") but no worked figures. The counted gate clues are the lens description and the room's bit-depth label.

  - id: puzzle-tune-sampling
    requirements: [{ kind: flag-set, flag: sound-sampled }]
    onSolve: [{ kind: complete-topic, topicId: sound-representation }]
    topicId: sound-representation
    score: 1
    hintSequenceId: hint-representation
    dependsOn: [puzzle-build-mosaic]
    authoring:
      pillar: >-
        P-b, P-c — sound becomes timed measurements, and sampling one opens the stacks.
      task: >-
        You patch the blank dial and sample the sound so the in arch opens. The choir sings in evenly spaced bursts; one dial counts samples per second and another counts bits per sample, so each measurement takes its place in a timed series.
      producedBy: >-
        `USE the sample fork on the bit-rate desk` sets `sound-sampled`; owner: `item-sample-fork` useNotes (verbatim).
      clues:
        - >-
          `item-sample-fork` description: "A tuning fork with two patch prongs and a paper tag: SAMPLE A SOUND, THEN GO IN. Its handle lists "samples per second, bits per sample, channels" in faded ink."
        - >-
          `room-sound-choir` description: "A choir of glass pipes sings in flat, evenly spaced bursts. At the bit-rate desk, one dial is marked "samples per second", another "bits per sample"; a third dial is blank, waiting for a patch lead. A card defines a sample as one measurement at a point in time, and lists channels, sample rate, bit depth and bit rate."
        - >-
          `quiz-sound-representation` q-dr-23 explanation (real quiz key; it opens later than this gate): storage is sample rate × bit depth × channels × duration, here 44,100 samples per second × 16 bits × 2 channels × 180 seconds, and the key prints no final bit total. `npc-choirmaster` dialogue `topic-conductor-storage` is a candidate placement, not in the card and not counted: it states the method but carries no worked figures. The counted gate clues are the fork's tag and the desk card in the room description.

  - id: puzzle-stack-the-bytes
    requirements: [{ kind: flag-set, flag: stacks-sorted }]
    onSolve: [{ kind: complete-topic, topicId: data-storage-units }]
    topicId: data-storage-units
    score: 1
    hintSequenceId: hint-storage-capacity
    dependsOn: [puzzle-tune-sampling]
    authoring:
      pillar: >-
        P-b, P-c — capacity is a chain of shelves, and sorting it opens the press.
      task: >-
        You sort the crates onto the unit ladder so the out arch opens. The joints from byte upward are marked ×1024, and the brass plate gives the first step: one kilobyte holds 1,024 bytes.
      producedBy: >-
        `USE the sample fork on the unit ladder` sets `stacks-sorted`; owner: `item-sample-fork` useNotes in the accepted `rooms.md`. Flag names stay as recorded.
      clues:
        - >-
          `room-storage-stacks` description: "A unit ladder rises in eight rungs: bit, nibble, byte, KB, MB, GB, TB, PB; from byte upward, each joint is marked ×1024."
        - >-
          `room-storage-stacks` description: "The labels flake at the corners, and the air is dry and dusty. A brass plate states that one kilobyte holds 1,024 bytes." The plate gives the exact figure among the flaking labels.
        - >-
          `npc-stack-keeper` dialogue `topic-keeper-units` (real source): "Count twice, stack once" and the rung chain "bit, nibble, byte, then KB, MB, GB, TB, PB"; from byte upward every joint is ×1024, and the brass plate says one kilobyte holds 1,024 bytes. The 4-bits/8-bits wording is not his: it is in `hint-storage-capacity` level 2 ("A nibble is four bits and a byte is eight bits").

  - id: puzzle-pack-the-archive
    requirements: [{ kind: flag-set, flag: archive-packed }]
    onSolve: [{ kind: complete-topic, topicId: data-compression }]
    topicId: data-compression
    score: 1
    hintSequenceId: hint-compression-ratio
    dependsOn: [puzzle-stack-the-bytes]
    authoring:
      pillar: >-
        P-b, P-c, P-d — the press is a physical trade-off, delivered with a straight-faced sales pitch.
      task: >-
        You pack the archive with the die so the press finishes the zone. Two trays come back different: one exactly as it went in, the other smaller and softer. The ratio window shows what each setting did, so size alone tells only part of the story.
      producedBy: >-
        `USE the compression die` sets `archive-packed`; owner: `item-compression-die` useNotes (verbatim).
      clues:
        - >-
          `item-compression-die` description: "A steel die with two settings cut into its rim, LOSSLESS and LOSSY. A small window shows an original column beside a compressed one."
        - >-
          `room-compression-press` description: "Two trays feed a press with a glass ratio window: one column reads "original", the other "compressed". A sample tray slides out with the file exactly as it went in; a second returns smaller and a little blurred. A lever is labelled lossless at one end and lossy at the other."
        - >-
          `quiz-data-compression` q-dr-31 and q-dr-32 explanations (real quiz keys; they open after this gate): the worked ratio is 1000 ÷ 200 = 10:2, and 2000 KB at 10:2 gives 400 KB. The press operator's `topic-operator-ratio` line is a candidate placement, not in the card and not counted: it gives the rule but no worked numbers. The counted gate clues are the die's rim and the two sample trays in the room description.

  - id: puzzle-check-the-overflow-register
    requirements: [{ kind: flag-set, flag: overflow-checked }]
    onSolve: [{ kind: complete-topic, topicId: number-conversion }]
    topicId: number-conversion
    score: 1
    hintSequenceId: hint-number-systems
    dependsOn: [puzzle-add-with-carries]
    authoring:
      pillar: >-
        P-b, P-c — a spare bit is a physical object in a tray, and accounting for it is the gate.
      task: >-
        You show the foreman the gauge when a carry runs off the register so the spare bits are accounted for. The deck's lamp drips 1s into the tray below it; each one has a place there instead of disappearing.
      producedBy: >-
        `SHOW the switch gauge to npc-the-foreman after the carry runs off the register` sets `overflow-checked`; owner: `item-switch-gauge` useNotes (verbatim).
      clues:
        - >-
          `room-hex-deck` description: "A stuck carry lamp drips 1s into an OVERFLOW tray."
        - >-
          `item-overflow-tray` description (real): "A shallow tin overflow tray beneath the carry lamp, scratched OVERFLOW along its rim. A few bright 1s have collected in its bottom." The foreman's response to SHOWing the gauge (`topic-foreman-show-gauge`, always active) is a real producer but only logs the gauge ("I'll log it against the register, needle and all"); it does not ask about a carry running off the end and does not explain overflow, so it is not counted as an explanation clue.
        - >-
          `hint-number-systems` level 4 (real source): "A bit pushed past the last column drops into the tray scratched OVERFLOW under the carry lamp instead of vanishing." That names the tray and the spare bit, with no numeric result.
        - >-
          `item-switch-gauge` useNotes (authoring producer record, not a player-discoverable clue): "SHOW the switch gauge to the foreman after a carry runs off the register sets `overflow-checked`" — the condition and the target are both named (§1.2.1 asks only for the concept of overflow and underflow; no worked number is asserted).

  - id: puzzle-weigh-the-pixels
    requirements: [{ kind: flag-set, flag: pixels-weighed }]
    onSolve: [{ kind: complete-topic, topicId: graphics-representation }]
    topicId: graphics-representation
    score: 1
    hintSequenceId: hint-representation
    dependsOn: [puzzle-build-mosaic]
    authoring:
      pillar: >-
        P-b, P-c — stored squares can be compared against a nibble card, and the comparison is the gate.
      task: >-
        You weigh the mosaic's stored squares against the nibble card's groups of four. The lens turns each square into a row of numbers; bit depth and the number of channels decide how many bits that row holds.
      producedBy: >-
        `USE the pixel lens on the nibble card` sets `pixels-weighed`; owner: `item-pixel-lens` and `item-hex-nibble-card` useNotes (verbatim, same action in both).
      siblingCheck: >-
        No prose mentions the sibling leaf `puzzle-scale-the-badge`; either may be solved first (N7).
      clues:
        - >-
          `item-pixel-lens` description: "Through it, the mosaic squares turn into a tidy row of numbers."
        - >-
          `item-hex-nibble-card` description: "A card divided into nibble groups of four squares, one group per line" — a row of stored groups to compare with.
        - >-
          `room-picture-mosaic` description: "bit depth is the number of bits used for the colour of each pixel; colour depth is measured in bits per channel, or bpc."

