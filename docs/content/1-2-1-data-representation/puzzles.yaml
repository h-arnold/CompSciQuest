    authoring:
      pillar: >-
        P-b, P-c — stored squares can be compared against a nibble card, and the comparison is the gate.
      task: >-
        You weigh the mosaic's stored squares against the nibble card's groups of four. The obvious route — counting each square as one stored bit — fails because a pixel's colour takes several bits, set by bit depth and the number of channels.
      producedBy: >-
        `USE the pixel lens on the nibble card` sets `pixels-weighed`; owner: `item-pixel-lens` and `item-hex-nibble-card` useNotes (verbatim, same action in both).
      siblingCheck: >-
        No prose mentions the sibling leaf `puzzle-scale-the-badge`; either may be solved first (N7).
      clues:
        - >-
          `item-pixel-lens` description: "Through it, the mosaic squares turn into a tidy row of numbers."
        - >-
          `item-hex-nibble-card` description: "A card divided into groups of four squares, one group per line" — a row of stored groups to compare with.
        - >-
          `room-picture-mosaic` description: bit depth is the number of bits used for the colour of each pixel, and colour depth is measured in bits per channel (bpc).

