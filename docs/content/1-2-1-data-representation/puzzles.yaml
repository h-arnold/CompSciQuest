          `npc-press-operator` dialogue `topic-operator-lossy` (placement request): lossy generally reduces size more but also reduces quality; lossless maintains quality and can be uncompressed to its original form (§1.2.1).
        - >-
          `npc-press-operator` dialogue `topic-operator-ratio` (placement request): 1000 ÷ 200 = 10:2 and 2000 KB at 10:2 → 400 KB, so the ratio window can be read, not guessed (§1.2.1).
