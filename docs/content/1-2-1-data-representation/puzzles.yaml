      task: >-
        You show the foreman the gauge when a carry runs off the register so the spare bits are accounted for. The deck's lamp drips 1s into the tray below it; each one has a place there instead of disappearing.
      producedBy: >-
        `SHOW the switch gauge to npc-the-foreman after the carry runs off the register` sets `overflow-checked`; owner: `item-switch-gauge` useNotes (verbatim).
      clues:
        - >-
          `room-hex-deck` description: "A stuck carry lamp drips 1s into an OVERFLOW tray."
        - >-
          `npc-the-foreman`'s response to SHOWing the gauge (`topic-foreman-show-gauge`, always active): he asks to see the gauge when a carry runs off the end, and explains overflow without a numeric result.
        - >-
          `item-switch-gauge` useNotes: "SHOW the switch gauge to the foreman after a carry runs off the register sets `overflow-checked`" — the condition and the target are both named (§1.2.1 asks only for the concept of overflow and underflow; no worked number is asserted).

