        Use the base-2 prose chain at §1.2.1 L566–570 only; the "Equivalent" column at L683–685 is inconsistent and is not used.
      clues:
        - >-
          `room-storage-stacks` description: "A unit ladder rises in eight rungs: bit, nibble, byte, KB, MB, GB, TB, PB; from byte upward, each joint is marked ×1024. The labels flake at the corners, and the air is dry and dusty. A brass plate states that one kilobyte holds 1,024 bytes."
        - >-
