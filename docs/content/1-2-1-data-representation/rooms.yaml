kind: area
areaId: 1-2-1-data-representation
status: approved
topicIds: [switch-to-bit, data-types, number-conversion, character-representation, graphics-representation, sound-representation, data-storage-units, data-compression, ai-ethics-and-implications]

definition:
  id: area-1-2-1-data-representation
  worldId: world-wjec-gcse-computer-science-2025-spec
  name: The Switchyard
  startRoomId: room-binary-hall
  lives: 3
  authoring:
    pillar: >-
      P-a, P-b, P-c, P-d; the AI's "compliance" framing, each abstraction as a floor, competence gates, and deadpan machinery
    notes: >-
      `startRoomId` is the runtime successor to the old `levelStart: true` authoring note (content-rules D4; application-and-ui §3.2). It is declared once, here. Rooms are navigation and setting, so every room declares `score: 0` (P6; topic file §3). Entry effects are empty and therefore omitted (D3).
    worldIdNote: >-
      `worldId: world-wjec-gcse-computer-science-2025-spec` is the single world for the machine, resolved and declared once by `area-entry-interface` (decision 2026-11-25). This area names it only.

rooms:
  - id: room-entry-interface
    title: The Interface
    aliases: [interface, entry, hub]
    description: >-
      A narrow interface glows around you, a single arrow painted east on its rim. Beyond it, a machine clears its throat and reads out your attendance record in a flat, well-practised voice. A strip of text scrolls past: MASTERY OF THE WHOLE OF UNIT 1, OR DELETION. The arrow east points to the switch floor; behind you, another opening gives onto the Network Hub. The machine has clearly said all this before.
    topicIds: [ai-ethics-and-implications]
    exits:
      - { direction: east, to: room-switch-floor }
      - { direction: out, to: room-network-hub }
    score: 0
    authoring:
      interesting: >-
        The attendance record and the worn, repeated verdict; a machine that already knows who you are.
      pillar: >-
        P-a, P-e; the AI's attention metric and its dry, official framing.

  - id: room-switch-floor
    title: The Switch Floor
    aliases: [switch floor, foundry, workshop]
    description: >-
      Heat haze shimmers off a belt of tiny black switches, and the clicks are getting faster. A brass gauge hangs by the belt, needle at red; the foreman checks the clicks, oil can in hand. Glass vacuum tubes carry a before label. Each switch is a transistor — a tiny switch that decides whether a line carries a one or a zero. A sign says modern ones arrive packed onto chips. A stair climbs up; west leads to the Network Hub.
    topicIds: [switch-to-bit]
    exits:
      - { direction: west, to: room-network-hub }
      - { direction: up, to: room-binary-hall }
    scenery:
      - name: belt
        aliases: [belt, switch belt]
        description: >-
          The belt clicks as its tiny switches settle into place.
    interactions:
      - kind: use
        itemId: item-switch-gauge
        target: { kind: scenery, name: belt }
        flags: [switch-cooled, switches-set]
        text: >-
          The gauge cools the belt and clicks every switch into place.
    score: 0
    authoring:
      interesting: >-
        The retired "before" rack beside the accelerating belt; a switch small enough to miss.
      pillar: >-
        P-b, P-d; the switch becomes a physical machine part, delivered straight.
      telegraph: >-
        H1 — heat haze off the belt and accelerating clicks, read before `hazard-switch-overheat` can fire.

  - id: room-binary-hall
    title: The Binary Hall
    aliases: [binary hall, hall, counting hall]
    description: >-
      Five type bins: "if Valid = True", letter "A", age 15, temperature 36.4, email "computer.science@wjec.co.uk"; a sixth unlabelled decimal sample has no bin name. A painted route diagram names each gate: north switches-set, east hex-read, south characters-matched, up picture-built, in sound-sampled, out stacks-sorted. The arches repeat: switches, nibbles, tiles, image, sound, stacks. The foreman ticks the bins. A comic sans cartridge warms and hums; its notice reads "Unauthorised font use is a compliance infringement". Down leads to the switch floor.
    topicIds: [data-types, number-conversion]
    exits:
      - { direction: down, to: room-switch-floor }
      - { direction: west, to: room-network-hub }
      - { direction: north, to: room-hex-deck, conditions: [{ kind: flag-set, flag: switches-set }] }
      - { direction: east, to: room-character-tiles, conditions: [{ kind: flag-set, flag: hex-read }] }
      - { direction: south, to: room-picture-mosaic, conditions: [{ kind: flag-set, flag: characters-matched }] }
      - { direction: up, to: room-sound-choir, conditions: [{ kind: flag-set, flag: picture-built }] }
      - { direction: in, to: room-storage-stacks, conditions: [{ kind: flag-set, flag: sound-sampled }] }
      - { direction: out, to: room-compression-press, conditions: [{ kind: flag-set, flag: stacks-sorted }] }
    scenery:
      - name: real bin
        aliases: [real bin, bin]
        description: >-
          The real bin is labelled for a number with a decimal point.
    interactions:
      - kind: put
        itemId: item-decimal-sample
        target: { kind: scenery, name: real bin }
        flags: [types-sorted]
        text: >-
          You place the decimal sample in the real bin.
    score: 0
    authoring:
      interesting: >-
        The painted diagram that turns navigation into a list of conditions, plus one decimal sample with no bin name.
      pillar: >-
        P-b, P-c, P-d; concepts are mechanisms, gates are conceptual, and the cartridge is a bounded joke.
      telegraph: >-
        H1 — the comic sans cartridge is warm and humming, as if it would like to be used, beside the compliance notice.
      clues: |-
        N6 — two in-world clues per gated exit, both discoverable in this room before the gate opens:
        - `switches-set` (north): the painted route diagram names the gate "switches-set"; the north arch repeats "switches".
        - `hex-read` (east): the route diagram names "hex-read"; the east arch repeats "nibbles".
        - `characters-matched` (south): the route diagram names "characters-matched"; the south arch repeats "tiles".
        - `picture-built` (up): the route diagram names "picture-built"; the up arch repeats "image".
        - `sound-sampled` (in): the route diagram names "sound-sampled"; the in arch repeats "sound".
        - `stacks-sorted` (out): the route diagram names "stacks-sorted"; the out arch repeats "stacks".
      fixtureNotes: >-
        PUTTING the unlabelled decimal sample on the `real` bin sets `types-sorted`; the spec's real example is temperature 36.4, a number with a decimal point.

  - id: room-hex-deck
    title: The Hex Deck
    aliases: [hex deck, deck, hexadecimal]
    description: >-
      A carry track reads "1 + 1 = 0, carry 1"; a token waits at the rightmost column. Arrow notches and a lever line the shift gutter; its rule card reads: left shift multiplies by a multiple of 2, right shift divides by a multiple of 2; a bit past the end is overflow. A stuck carry lamp drips 1s into an OVERFLOW tray. The nibble card lies open; the clerk tidies its four-square groups. South returns to the hall.
    topicIds: [number-conversion]
    exits:
      - { direction: south, to: room-binary-hall }
    scenery:
      - name: carry lamp
        aliases: [carry lamp, lamp]
        description: >-
          A carry lamp hangs above a scratched overflow tray.
      - name: carry token
        aliases: [carry token, token]
        description: >-
          A bright carry token waits beside the addition columns.
      - name: nibble groups
        aliases: [nibble groups, nibbles, groups]
        description: >-
          The card groups its marks into nibbles of four.
      - name: rightmost column
        aliases: [rightmost column, column]
        description: >-
          The rightmost column is marked for the first carry.
      - name: shift lever
        aliases: [shift lever, lever]
        description: >-
          The shift lever has notches for moving the marked row.
      - name: row
        aliases: [row, marked row]
        description: >-
          A row of bits waits beside the shift gutter.
    interactions:
      - kind: use
        itemId: item-hex-nibble-card
        target: { kind: scenery, name: carry lamp }
        flags: [carry-cleared]
        text: >-
          The card fits the lamp socket and clears its carry warning.
      - kind: use
        itemId: item-hex-nibble-card
        target: { kind: scenery, name: nibble groups }
        flags: [hex-read]
        text: >-
          You read the card in nibbles and mark the groups on the deck.
      - kind: use
        item: { kind: scenery, name: carry token }
        target: { kind: scenery, name: rightmost column }
        flags: [carries-added]
        text: >-
          You place the carry token in the rightmost column.
      - kind: use
        item: { kind: scenery, name: shift lever }
        target: { kind: scenery, name: row }
        flags: [row-shifted]
        text: >-
          You move the lever and shift the marked row.
    score: 0
    authoring:
      interesting: >-
        A dripping lamp whose spilled 1s land in a tray already named OVERFLOW.
      pillar: >-
        P-b, P-c; arithmetic is a track with moving parts, and reading it opens the next layer.
      telegraph: >-
        H1 — the stuck carry lamp dripping spare 1s into the OVERFLOW tray, read before `hazard-carry-overflow` can fire.
      fixtureNotes: >-
        USING the carry token on the rightmost column sets `carries-added`; USING the shift lever on the row in the shift gutter sets `row-shifted`.

  - id: room-character-tiles
    title: The Character Tiles
    aliases: [character tiles, tiles, characters]
    description: >-
      A character case lies open, each tile holding a single mark. The typesetter slides a tile into place with a courtly nod; beside it, the ASCII stamp lists its characters in a neat row. A spare drawer holds a tile bearing ŵ, labelled "a different character". One tile has lost the corner of its glyph. Grey dust coats the stamp. The door west leads back to the hall.
    topicIds: [character-representation]
    exits:
      - { direction: west, to: room-binary-hall }
    scenery:
      - name: tiles
        aliases: [tiles, character tiles, character case]
        description: >-
          The character case holds ordered rows of marked tiles.
    interactions:
      - kind: examine
        target: { kind: scenery, name: tiles }
        flags: [tiles-verified]
        text: >-
          You check the marked tiles and verify their order.
      - kind: use
        itemId: item-ascii-stamp
        target: { kind: scenery, name: tiles }
        flags: [characters-matched]
        text: >-
          The stamp matches each character to its place in the case.
    score: 0
    authoring:
      interesting: >-
        A spare tile kept carefully in its own drawer, beside a stamp that has seen better days.
      pillar: >-
        P-b, P-c; a character set is a physical case of marks, and matching them opens the gallery.
      telegraph: >-
        H1 — a tile missing the corner of its glyph and grey dust on the stamp, read before `hazard-glyph-corruption` can fire.

  - id: room-picture-mosaic
    title: The Picture Mosaic
    aliases: [picture mosaic, mosaic, gallery]
    description: >-
      A pixel mosaic covers one wall, each square a stored colour value. A vector sheet in the drafting corner shows curves scaling cleanly; a pixel grid squares off, and a mosaic ruler marks width and height. A label states: bit depth is the number of bits used for the colour of each pixel; colour depth is measured in bits per channel, or bpc. The critic lifts the lens to missing squares where resolution runs out. North returns to the hall.
    topicIds: [graphics-representation]
    exits:
      - { direction: north, to: room-binary-hall }
    scenery:
      - name: mosaic
        aliases: [mosaic, picture mosaic]
        description: >-
          A square mosaic waits for its missing coloured squares.
    interactions:
      - kind: use
        itemId: item-pixel-lens
        target: { kind: scenery, name: mosaic }
        flags: [picture-built]
        text: >-
          Through the lens, the numbered squares form a complete picture.
      - kind: use
        itemId: item-pixel-lens
        target: { kind: item, id: item-hex-nibble-card }
        flags: [pixels-weighed]
        text: >-
          You compare the pixel grid with the values on the nibble card.
    score: 0
    authoring:
      interesting: >-
        Smooth curves and a squaring grid side by side; the same picture stored two ways.
      pillar: >-
        P-b, P-c; storage methods are materials you can compare, and building the image opens the choir.

  - id: room-sound-choir
    title: The Sound Choir
    aliases: [sound choir, choir, sampling]
    description: >-
      A choir of glass pipes sings in flat, evenly spaced bursts. At the bit-rate desk, one dial is marked "samples per second", another "bits per sample"; a third dial is blank, waiting for a patch lead. A card defines a sample as one measurement at a point in time, and lists channels, sample rate, bit depth and bit rate. A sample fork lies on the desk; the choirmaster taps the time with his baton. Down returns to the hall.
    topicIds: [sound-representation]
    exits:
      - { direction: down, to: room-binary-hall }
    scenery:
      - name: bit-rate desk
        aliases: [bit rate desk, bit-rate desk, desk]
        description: >-
          The desk carries sampling dials and a blank bit-rate dial.
    interactions:
      - kind: use
        itemId: item-sample-fork
        target: { kind: scenery, name: bit-rate desk }
        flags: [sound-sampled]
        text: >-
          The fork sounds a clear sample and the desk records it.
    score: 0
    authoring:
      interesting: >-
        A blank dial with a patch lead beside it; the recording is missing one measurement.
      pillar: >-
        P-b, P-c; sound becomes timed measurements, and sampling one opens the stacks.

  - id: room-storage-stacks
    title: The Storage Stacks
    aliases: [storage stacks, stacks, capacity]
    description: >-
      A unit ladder rises in eight rungs: bit, nibble, byte, KB, MB, GB, TB, PB; from byte upward, each joint is marked ×1024. The labels flake at the corners, and the air is dry and dusty. A brass plate states that one kilobyte holds 1,024 bytes. The stack keeper wipes a rung and checks his tally; crates wait by the open arch. The way out returns to the hall.
    topicIds: [data-storage-units]
    exits:
      - { direction: out, to: room-binary-hall }
    scenery:
      - name: unit ladder
        aliases: [unit ladder, ladder]
        description: >-
          The unit ladder climbs from bit to byte and beyond.
    interactions:
      - kind: use
        itemId: item-sample-fork
        target: { kind: scenery, name: unit ladder }
        flags: [stacks-sorted]
        text: >-
          The fork marks each unit as you order the stacks on the ladder.
    score: 0
    authoring:
      interesting: >-
        A ladder of capacities you can climb, with one exact plate among the flaking labels.
      pillar: >-
        P-b, P-c; capacity is a physical chain of shelves, and sorting it opens the press.
      telegraph: >-
        H1 — flaking labels and a dry, dusty smell, read before `hazard-bit-rot` can fire.

  - id: room-compression-press
    title: The Compression Press
    aliases: [compression press, press, squash]
    description: >-
      Two trays feed a press with a glass ratio window: one column reads "original", the other "compressed". A sample tray slides out with the file exactly as it went in; a second returns smaller and a little blurred. A lever is labelled lossless at one end and lossy at the other. The press operator sets the compression die and smiles at the smaller tray. The arch in leads back to the hall.
    topicIds: [data-compression]
    exits:
      - { direction: in, to: room-binary-hall }
    interactions:
      - kind: use
        itemId: item-compression-die
        flags: [archive-packed]
        text: >-
          You set the die and pack the archive into its smaller column.
      - kind: use
        itemId: item-compression-die
        target: { kind: item, id: item-ascii-stamp }
        flags: [compression-chosen]
        text: >-
          You compare the stamped characters and choose the compression setting.
    score: 0
    authoring:
      interesting: >-
        One tray gives the file back unchanged, the other keeps less and looks softer.
      pillar: >-
        P-b, P-c, P-d; the choice is physical and consequential, with a straight-faced sales pitch to follow.

items:
  - id: item-switch-gauge
    name: switch gauge
    aliases: [switch gauge, gauge]
    portable: true
    description: >-
      A brass gauge on a leather strap. Its needle rests against a stamped line: SET EVERY SWITCH, THEN TAKE THE NORTH STAIR. A small dial marked COOL is stuck at red. A stamped tab reads "denary 37 — what binary pattern?"
    initialRoom: room-switch-floor
    authoring:
      useNotes: >-
        USE the switch gauge on the belt of tiny black switches sets `switch-cooled`, which disarms `hazard-switch-overheat`. SHOW the switch gauge to the foreman after a carry runs off the register sets `overflow-checked`. Taking the gauge sets no flag. SETTING every switch on the belt (USE the switch gauge on the belt of tiny black switches) also sets `switches-set`.

  - id: item-before-label
    name: before label
    aliases: [before label, tube label]
    portable: false
    description: >-
      A stiff paper label wired to the vacuum-tube rack, its ink bleached to "before". The wire is twisted tight; the label has hung here longer than the belt has run.
    initialRoom: room-switch-floor
    authoring:
      useNotes: >-
        EXAMINE the before label to read its faded lettering. Purely decorative: examining it sets no flag.

  - id: item-oil-can
    name: oil can
    aliases: [oil can, oilcan]
    portable: true
    description: >-
      A dented oil can with a long bent spout, warm from the foreman's hand. A dark smear on the belt marks where it has been set down between rounds.
    initialRoom: room-switch-floor
    authoring:
      useNotes: >-
        EXAMINE the oil can to see the bent spout and the oil smear. Purely decorative: examining or carrying it sets no flag.

  - id: item-hex-nibble-card
    name: nibble card
    aliases: [nibble card, hex card]
    portable: true
    description: >-
      A card divided into nibble groups of four squares, one group per line. Its back is stamped READ THE NIBBLES BEFORE THE EAST DOOR OPENS. A hollow at the top fits the carry token.
    initialRoom: room-hex-deck
    authoring:
      useNotes: >-
        USE the nibble card on the carry lamp sets `carry-cleared`, which disarms `hazard-carry-overflow`. USE the pixel lens on the nibble card sets `pixels-weighed`. SHOW the nibble card to the foreman sets `capacity-labelled`. READING the nibbles (USE the nibble card on the nibble groups) sets `hex-read`.

  - id: item-rule-card
    name: rule card
    aliases: [rule card, sum card]
    portable: true
    description: >-
      A dog-eared rule card pinned beside the shift gutter, its worked sum pressed deep into the paper. One corner is torn where a clip has held it for years.
    initialRoom: room-hex-deck
    authoring:
      useNotes: >-
        EXAMINE the rule card to read its worked sum. Purely decorative: examining or carrying it sets no flag.

  - id: item-overflow-tray
    name: overflow tray
    aliases: [overflow tray, catch tray]
    portable: false
    description: >-
      A shallow tin overflow tray beneath the carry lamp, scratched OVERFLOW along its rim. A few bright 1s have collected in its bottom.
    initialRoom: room-hex-deck
    authoring:
      useNotes: >-
        EXAMINE the overflow tray to see the scratches on its rim. Purely decorative: examining it sets no flag.

  - id: item-ascii-stamp
    name: ascii stamp
    aliases: [ascii stamp, stamp]
    portable: true
    description: >-
      A wooden stamp with a character list on its case lid: "ASCII and Unicode: standardised character sets." The case is scratched MATCH THE TILES, THEN GO SOUTH. Grey dust sits in the grooves.
    initialRoom: room-character-tiles
    authoring:
      useNotes: >-
        EXAMINE the tiles in the character case to verify them before using the stamp sets `tiles-verified`, which disarms `hazard-glyph-corruption`; using the stamp before verifying triggers that hazard. USE the compression die on the ASCII stamp sets `compression-chosen`. MATCHING the tiles (USE the ASCII stamp on the tiles in the character case) sets `characters-matched`.

  - id: item-spare-drawer
    name: spare drawer
    aliases: [spare drawer, drawer]
    portable: false
    description: >-
      A shallow spare drawer slid into the base of the character case, lined with felt. A single tile rests in it, kept apart from the ordered rows above.
    initialRoom: room-character-tiles
    authoring:
      useNotes: >-
        EXAMINE the spare drawer to see its felt lining and the tile kept inside. Purely decorative: examining it sets no flag.

  - id: item-pixel-lens
    name: pixel lens
    aliases: [pixel lens, lens]
    portable: true
    description: >-
      A glass lens in a cork holder, ground with a fine square grid. Its cap reads BUILD THE IMAGE, THEN CLIMB. Through it, the mosaic squares turn into a tidy row of numbers.
    initialRoom: room-picture-mosaic
    authoring:
      useNotes: >-
        USE the pixel lens in the drafting corner sets `mosaic-calibrated` (authoring note only: a proposed hazard has no card yet, so no hazard depends on this flag in this card). SHOW the pixel lens to the foreman sets `badge-scaled`. USE the pixel lens on the nibble card sets `pixels-weighed`. BUILDING the image (USE the pixel lens on the mosaic) sets `picture-built`.

  - id: item-mosaic-ruler
    name: mosaic ruler
    aliases: [mosaic ruler, ruler]
    portable: true
    description: >-
      A polished mosaic ruler with fine width-and-height marks, its edges worn from measuring grids. A notch marks where the missing squares begin.
    initialRoom: room-picture-mosaic
    authoring:
      useNotes: >-
        EXAMINE the mosaic ruler to read its width and height marks. Purely decorative: examining or carrying it sets no flag.

  - id: item-vector-sheet
    name: vector sheet
    aliases: [vector sheet, curve sheet]
    portable: true
    description: >-
      A translucent vector sheet of smooth curves, each drawn as one clean line. Held up to the light, the curves stay smooth however far you tilt it.
    initialRoom: room-picture-mosaic
    authoring:
      useNotes: >-
        EXAMINE the vector sheet to trace its clean curves. Purely decorative: examining or carrying it sets no flag.

  - id: item-sample-fork
    name: sample fork
    aliases: [sample fork, fork]
    portable: true
    description: >-
      A tuning fork with two patch prongs and a paper tag: SAMPLE A SOUND, THEN GO IN. Its handle lists "samples per second, bits per sample, channels" in faded ink.
    initialRoom: room-sound-choir
    authoring:
      useNotes: >-
        USE the sample fork on the bit-rate desk sets `sound-sampled`. SHOW the sample fork to the foreman sets `bit-rate-counted`. USING the fork on the unit ladder (USE the sample fork on the unit ladder) sets `stacks-sorted`.

  - id: item-patch-lead
    name: patch lead
    aliases: [patch lead, lead]
    portable: true
    description: >-
      A short patch lead with two brass plugs, one end taped where the insulation has frayed. It lies beside the blank dial on the bit-rate desk.
    initialRoom: room-sound-choir
    authoring:
      useNotes: >-
        EXAMINE the patch lead to see its taped plug. Purely decorative: examining or carrying it sets no flag.

  - id: item-brass-plate
    name: brass plate
    aliases: [brass plate, plate]
    portable: false
    description: >-
      A small brass plate bolted to the unit ladder, its engraving polished by passing thumbs. It gives the byte count for one kilobyte.
    initialRoom: room-storage-stacks
    authoring:
      useNotes: >-
        EXAMINE the brass plate to read its engraved capacity. Purely decorative: examining it sets no flag.

  - id: item-compression-die
    name: compression die
    aliases: [compression die, die]
    portable: true
    description: >-
      A steel die with two settings cut into its rim, LOSSLESS and LOSSY. A small window shows an original column beside a compressed one.
    initialRoom: room-compression-press
    authoring:
      useNotes: >-
        USE the compression die sets `archive-packed`. USE the compression die on the ASCII stamp sets `compression-chosen`.

  - id: item-sample-tray
    name: sample tray
    aliases: [sample tray, output tray]
    portable: false
    description: >-
      A metal sample tray fixed below the press, its lip bent from years of use. A faint ghost of an older, smaller file marks its base.
    initialRoom: room-compression-press
    authoring:
      useNotes: >-
        EXAMINE the sample tray to see its bent lip and faint mark. Purely decorative: examining it sets no flag.

  - id: item-comic-sans-cartridge
    name: comic sans cartridge
    aliases: [comic sans cartridge, cursed cartridge]
    portable: true
    description: >-
      A warm, humming cartridge in a paper sleeve. A handwritten sticker reads "Unauthorised font use is a compliance infringement". It looks as if it would like to be used.
    initialRoom: room-binary-hall
    authoring:
      useNotes: >-
        USING the comic sans cartridge triggers `hazard-detention-bell` and costs one life; `once: true` on that hazard. It is required by no puzzle and is expendable, so using it never strands the player.

  - id: item-decimal-sample
    name: decimal sample
    aliases: [decimal sample, sample]
    portable: true
    description: >-
      You find a small unlabelled sample among the bins, showing 36.4. No type-bin name marks its face.
    initialRoom: room-binary-hall
    authoring:
      useNotes: >-
        PUTTING the unlabelled decimal sample on the `real` bin sets `types-sorted`; the spec's real example is temperature 36.4, a number with a decimal point.
