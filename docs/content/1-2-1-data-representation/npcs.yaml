conversationNodes:
  - id: node-predecessor-advice
    actorId: npc-predecessor
    isSticky: false
    topicIds: [topic-predecessor-comic-sans, topic-predecessor-geese, topic-predecessor-duck-as-bit]
    defaultTopicId: topic-predecessor-default
    authoring:
      note: >-
        Deliberate teaching beat on the Boolean duck, entered from `topic-predecessor-duck-as-bit` after the cartridge beat has been heard. Inside the node the live content is the geese keyword topic and the default; the comic-sans and duck beats are listed so the node carries the actor's full teaching set, but both are retired by the time it opens. Expires after one turn; no timeout.

  - id: node-foreman-switch-lesson
    actorId: npc-the-foreman
    isSticky: false
    topicIds: [topic-foreman-switches, topic-foreman-lift]
    defaultTopicId: topic-foreman-predecessor
    authoring:
      reserved: true
      note: >-
        Reserved and deliberately unentered in this card. It was to be entered from `topic-foreman-switches`, but that topic also starts `quiz-switchyard`, and `start-quiz` exits any active node before the quiz, so no conversational turn could happen inside the node. The foreman's teaching now lands in the ordinary topic responses (`topic-foreman-switches` and `topic-foreman-lift`). The artifact stays defined with a valid `defaultTopicId` and no turn timeout (C4); no new topic ID is allocated.

  - id: node-operator-choose
    actorId: npc-press-operator
    isSticky: true
    topicIds: [topic-operator-lossy, topic-operator-ratio]
    defaultTopicId: topic-operator-default
    authoring:
      stickyReason: >-
        The climax puzzle needs the player to tell lossy from lossless before committing a file; comparing the two trays and the ratio window takes several turns, so the node must stay open across them (C4). It still ends on `bye`, on leaving the room or on `start-quiz`; there is no turn timeout.
