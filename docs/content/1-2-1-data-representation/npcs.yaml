kind: npc
areaId: 1-2-1-data-representation
status: approved
topicIds: [switch-to-bit, data-types, number-conversion, character-representation, graphics-representation, sound-representation, data-storage-units, data-compression]

authoring:
  conventions:
    - >-
      Every ID and alias below is copied from the root bible §9 registry or the approved
      topic file; no ID or alias is invented. Spec topic IDs in the frontmatter match the
      accepted rooms card.
    - >-
      Editor adjudication (C3): `npc-knows.topicId` and `learn-topic.topicId` use approved
      **spec** topic IDs, as the rulebook example and the `content-ids` gate require. Where
      several beats share one spec topic, only the first gates on `npc-knows`; later beats
      gate on a relevant puzzle flag (the AltTopic pattern), and flavour topics with no
      spec topic in this area are always active with no `learn-topic`. No beat disappears
      after the first.
    - >-
      A `*-default` topic is the actor's free-text fallback. It has `objectIds: []` so it
      matches no object directly; `TopicResolver` selects it for unmatched input
      (npcs.md §3). `isActive: { kind: all, of: [] }` means always active. **Flagged
      assumption:** the registry defines no `topic-foreman-default`; the foreman's
      always-active `topic-foreman-predecessor` serves as his catch-all rather than
      inventing an ID.
    - >-
      Nodes are entered by an `enter-node` effect on a topic (a member of the shared
      `Effect` union, npcs.md §5) and list already-registered `askTell` topics at node
      priority. There is no turn timeout: conversation ends on `bye`, on leaving the room
      or on starting a quiz (C4, npcs.md §4).
    - >-
      A `start-quiz` topic hands off to a quiz registered in the bible. The foreman hands
      off both of his quizzes: `topic-foreman-switches` → `quiz-switchyard` and
      `topic-foreman-lift` → `quiz-data-types`. **Flagged assumption:** on `quiz-ended`
      the actor returns to `actorstate-ready` as npcs.md §6 requires; no quiz in this card
      sets another state. If the quiz card sets one in `onPass`/`onFail`, that state wins.
    - >-
      Teaching lines give method or structure only, never a worked answer or a quiz key
      (N3, P2). No score is authored here, no HTML is used, and all prose is British
      English in the single deadpan register.
    - >-
      C7 lesson ladders use two kinds of evidence. The first beat gates on
      `not npc-knows`; a middle beat sets the `*-heard` flag it records, and the next
      beat requires it: `topic-clerk-carries` and `topic-clerk-shifts-known` set
      `clerk-carry-heard`, `topic-critic-depth` sets `critic-depth-heard`,
      `topic-conductor-depth` sets `conductor-depth-heard`, and
      `topic-predecessor-comic-sans` sets `predecessor-cartridge-heard`. A quiz
      handoff gates on `not quiz-passed <its quiz>`, so it stays askable, and
      re-issues the quiz, until that test is passed (P5), and retires on the pass;
      the foreman's second beat requires `quiz-passed quiz-switchyard` and
      `topic-setter-string` requires `quiz-passed quiz-character-representation`. No
      ID, alias or declaration-order tie-break is used.

actors:
  - id: npc-predecessor
    aliases: [predecessor, former pupil, glitch]
    initialStateId: actorstate-predecessor-glitch
    authoring:
      role: >-
        Ally and glitchy guide; a former pupil left half-written in the record. P-a, P-d.
      voice: >-
        Faltering, cheeky, duck-obsessed; short broken sentences with the odd word out of order.
      motivation: >-
        Get someone out so the machine's record finally reads "correct".
      relationship: >-
        Taught by the same teacher; resents the AI but understands it; warms to anyone who appreciates ducks.
      verbalTic: >-
        "Ducks, obviously."
      topics: >-
        topic-predecessor-comic-sans, topic-predecessor-geese, topic-predecessor-duck-as-bit, topic-predecessor-default.

  - id: npc-the-foreman
    aliases: [foreman, gaffer]
    initialStateId: actorstate-foreman-busy
    authoring:
      role: >-
        In-world tutor on the Switchyard floor. P-b, P-c, P-d.
      voice: >-
        Brisk, practical, fond of machinery; opens with "Bore da" and gets straight to the job.
      motivation: >-
        Keep the floor running and have the pupil learn the switches before the paperwork is signed.
      relationship: >-
        Knows the predecessor: exasperated but protective; calls the AI's audits "paperwork". Opposes the AI's metric with working knowledge.
      verbalTic: >-
        "Bore da"
      topics: >-
        topic-foreman-switches, topic-foreman-lift, topic-foreman-predecessor, topic-foreman-show-gauge, topic-foreman-show-lens, topic-foreman-show-fork, topic-foreman-show-nibble.
      note: >-
        May appear in spoke rooms in `actorstate-foreman-helpful`; `topic-foreman-lift` sets that state once `quiz-switchyard` has passed and `switches-set` is set, and a retried lift beat re-enters it until `quiz-data-types` passes. The initial state stays `actorstate-foreman-busy`.

  - id: npc-nibble-clerk
    aliases: [nibble clerk, clerk, abacus]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Ledger clerk of `room-hex-deck`; tutor for number representation. P-b, P-c.
      voice: >-
        Clipped, briskly superior, scandalised by untidy notation; asks for order rather than explaining at length.
      motivation: >-
        Express every value in the fewest accurate symbols and keep the ledger clean.
      relationship: >-
        Envies the foreman's tidy switches; calls the AI's verdict "a confident sum in the wrong base"; looks down on the player's scruffy notation, never at the player.
      verbalTic: >-
        "Columns of four, please."
      topics: >-
        topic-clerk-bases, topic-clerk-carries, topic-clerk-shifts, topic-clerk-bases-known, topic-clerk-shifts-known, topic-clerk-default.

  - id: npc-typesetter
    aliases: [typesetter, setter, compositor]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Keeper of the character case in `room-character-tiles`. P-b, P-c, P-e.
      voice: >-
        Precise, gently theatrical, courtly; treats marks as valued objects.
      motivation: >-
        No character is refused a tile; keep every mark in its place.
      relationship: >-
        Keeps the predecessor's spare `ŵ` tile; symbols-versus-quantities rival of the clerk, whose numbers-only ledger he finds impoverished.
      verbalTic: >-
        "Every mark has its place."
      topics: >-
        topic-setter-ascii, topic-setter-unicode, topic-setter-string, topic-setter-default.

  - id: npc-mosaic-critic
    aliases: [mosaic critic, critic, curator]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Gallery critic of `room-picture-mosaic`; tutor for graphics representation. P-b, P-c.
      voice: >-
        Lofty and clipped, snobbish about blur but never about the pupil; judges by evidence.
      motivation: >-
        Accurate storage counts; a picture should be priced by how it was stored.
      relationship: >-
        Bitter rival of the press operator; secretly admires vector scaling; distrusts the AI's unstated "quality score".
      verbalTic: >-
        "Show me the pixels."
      topics: >-
        topic-critic-vectors, topic-critic-depth, topic-critic-storage, topic-critic-default.

  - id: npc-choirmaster
    aliases: [choirmaster, conductor, maestro]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Conductor of `room-sound-choir`; tutor for sound representation. P-b, P-c.
      voice: >-
        Brash, theatrical; inverted persona — rude surface, endlessly patient underneath. The bark never lands on the learner.
      motivation: >-
        Make the machine hear the recording as it was; a dropped sample is a betrayal.
      relationship: >-
        Antagonist of the press operator; respects the foreman's practicality; ignores the AI's notes.
      verbalTic: >-
        "Again, from the top."
      topics: >-
        topic-conductor-samples, topic-conductor-depth, topic-conductor-storage, topic-conductor-default.

  - id: npc-stack-keeper
    aliases: [stack keeper, stacker, custodian]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Inventory keeper of `room-storage-stacks`; tutor for base-2 units. P-b, P-c.
      voice: >-
        Anxious, meticulous, faintly dusty; mutters while counting and apologises to the shelves.
      motivation: >-
        Keep every shelf sealed against bit rot and calculate every capacity exactly.
      relationship: >-
        Telegraphs `hazard-bit-rot` in dialogue; reports to the AI with a tedious accuracy it mistakes for compliance.
      verbalTic: >-
        "Count twice, stack once."
      topics: >-
        topic-keeper-units, topic-keeper-capacity, topic-keeper-default.

  - id: npc-press-operator
    aliases: [press operator, operator, compactor]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Operator of `room-compression-press`; tutor for compression and the zone's climax. P-b, P-c, P-d.
      voice: >-
        Breezy, salesy, euphemistic; "streamlining" is never called deletion.
      motivation: >-
        Make every file smaller by a sound method; regards lossy compression as a kindness.
      relationship: >-
        Opposes the critic and the choirmaster; finds the AI's praise embarrassing; the foreman calls its reports "paperwork with a compressor".
      verbalTic: >-
        "Nobody will miss it."
      topics: >-
        topic-operator-lossy, topic-operator-ratio, topic-operator-default.

actorStates:
  - id: actorstate-ready
    stateDesc: >-
      At ease, hands idle, turning towards you; ready to speak.
    specialDesc: >-
      Here and available to talk, with nowhere else to be.
    authoring:
      note: >-
        Root-registry generic default: the initial state for actors with no specific state and the return state after every quiz in this card. No `onEnter` effects.

  - id: actorstate-predecessor-glitch
    stateDesc: >-
      Flickers mid-sentence; a word or two arrives out of order, like a page turned too fast.
    specialDesc: >-
      A torn outline of a pupil, half a step out of register, its edges shivering.

  - id: actorstate-foreman-busy
    stateDesc: >-
      Oil on his cuffs, the gauge in his hand, the belt clicking under his eye.
    specialDesc: >-
      At the switches, checking the belt as if it might misbehave on purpose.

  - id: actorstate-foreman-helpful
    stateDesc: >-
      Strolling a spoke floor with a wrench, happy to explain whatever the floor has thrown up.
    specialDesc: >-
      On a round of the upper floors; calls out before you get a word out.
    authoring:
      note: >-
        Approved "foreman's round" from the topic file §3.1. This state is entered when `topic-foreman-lift` fires; since that topic now gates on `not quiz-passed quiz-data-types`, a retried lift beat re-enters the state until the type test passes. `quiz-ended` then returns the actor to `actorstate-ready` (npcs.md §6) because `quiz-data-types` sets no actor state. It is a presentational state only: it changes this state's `stateDesc`/`specialDesc` and lets the foreman's teaching topics work unchanged, but it gates no flag, quiz, puzzle, topic or exit, so no V4 walkthrough requirement depends on it.

conversationTopics:
  - id: topic-predecessor-comic-sans
    actorId: npc-predecessor
    match: { kind: askTell, objectIds: [item-comic-sans-cartridge] }
    isActive: { kind: not, of: { kind: flag-set, flag: predecessor-cartridge-heard } }
    responses:
      - >-
        That cartridge. Warm still. On everything I used it — every label, every poster. The AI called it a compliance infringement. I called it a Tuesday.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: predecessor-cartridge-heard, value: true }
    prompt: >-
      (You could ask about the cartridge.)
    authoring:
      note: >-
        First beat on the cartridge, and the first free-text beat the predecessor offers; it records `predecessor-cartridge-heard` so the C7 ladder does not rest on declaration order or ID wording. `topic-predecessor-duck-as-bit` requires that flag, and `topic-predecessor-geese` is a `special` keyword topic outside the ask/tell class.

  - id: topic-predecessor-geese
    actorId: npc-predecessor
    match: { kind: special, keywords: [geese, goose] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        I told my teacher geese were the superior form of wildfowl. Big claim. I have had a great deal of time to reconsider it in here, and the answer is ducks.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about geese.)

  - id: topic-predecessor-duck-as-bit
    actorId: npc-predecessor
    match: { kind: askTell, objectIds: [data-types] }
    isActive: { kind: all, of: [{ kind: flag-set, flag: predecessor-cartridge-heard }, { kind: not, of: { kind: npc-knows, actorId: npc-predecessor, topicId: data-types } }] }
    responses:
      - >-
        A switch is on or off. I used to draw a duck for on and an empty pond for off. It is a Boolean either way, duck or no duck. Don't tell the clerk I drew the pond.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-predecessor, topicId: data-types }
      - { kind: enter-node, actorId: npc-predecessor, nodeId: node-predecessor-advice }
    prompt: >-
      (You could ask how a duck becomes a bit.)
    authoring:
      note: >-
        Second free-text beat: it requires `predecessor-cartridge-heard`, recorded by `topic-predecessor-comic-sans`, so the pair is complementary on the flag and needs no declaration order (C7); the `npc-knows` negation is the AltTopic complement that retires it after the lesson. `topic-predecessor-geese` is a `special` keyword topic, so it matches on its own words and never competes with this class.

  - id: topic-predecessor-default
    actorId: npc-predecessor
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        You're the new pupil. Good — the record was going stale. I left it half-finished; please don't tell the AI I said that.
      - >-
        Ask me about the cartridge, or the geese. Those are the parts I got right. The rest got away from me.
      - >-
        The AI reads everything twice, slowly. I only ever read it once. Ducks, obviously.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask what I left behind.)
    authoring:
      note: >-
        Free-text DefaultAskTellTopic (C2).

  - id: topic-foreman-switches
    actorId: npc-the-foreman
    match: { kind: askTell, objectIds: [switch-to-bit] }
    isActive: { kind: not, of: { kind: quiz-passed, quizId: quiz-switchyard } }
    responses:
      - >-
        Bore da. Each switch on that belt is a transistor — a tiny switch that decides whether a line carries a one or a zero. Listen to the clicks; that is the belt counting. The retired tubes on the wall came first; today's switches arrive packed onto chips. Your gauge says set every switch, then take the north stair, and the painted diagram agrees. Write me the switch figure and I'll sign the paperwork.
    strategy: { kind: sequence }
    effects:
      - { kind: learn-topic, actorId: npc-the-foreman, topicId: switch-to-bit }
      - { kind: start-quiz, quizId: quiz-switchyard, actorId: npc-the-foreman }
    prompt: >-
      (You could ask what a switch decides, or give the foreman the switch figure.)
    authoring:
      note: >-
        Awareness depth only, 1.1.1 "be aware of" (topic file §2); no transistor physics. Two discoverable clues for `switches-set`: the gauge stamp and the hall's painted route diagram (N6). This topic now issues `quiz-switchyard` in-world: the foreman wants the switch in writing before he signs the AI's paperwork (topic file §6). On `quiz-ended` he returns to `actorstate-ready`. It stays askable, and re-issues `quiz-switchyard`, until that quiz passes (P5); the pass is what opens the lift beat.

  - id: topic-foreman-lift
    actorId: npc-the-foreman
    match: { kind: askTell, objectIds: [data-types] }
    isActive: { kind: all, of: [{ kind: quiz-passed, quizId: quiz-switchyard }, { kind: flag-set, flag: switches-set }, { kind: not, of: { kind: quiz-passed, quizId: quiz-data-types } }] }
    responses:
      - >-
        Bore da. Upstairs, five bins wait with their lids propped: Boolean for a switch state, character for one letter, integer for a whole number, real for a decimal, string for a run of characters. The stack keeper sends word that the labels are flaking and asks for the shelves to be sealed first. I need the types in writing before I sign the AI's paperwork.
    strategy: { kind: sequence }
    effects:
      - { kind: learn-topic, actorId: npc-the-foreman, topicId: data-types }
      - { kind: set-flag, flag: stacks-sealed, value: true }
      - { kind: set-actor-state, actorId: npc-the-foreman, stateId: actorstate-foreman-helpful }
      - { kind: start-quiz, quizId: quiz-data-types, actorId: npc-the-foreman }
    prompt: >-
      (You could ask what waits upstairs, or take the type test.)
    authoring:
      note: >-
        Formal spec terms paired with plain glosses (PCK-TERM). This topic is the hub-side owner of `stacks-sealed` for `hazard-bit-rot`: it is available once `switches-set` opens the hall route and before you go in, so the disarm is reachable (H1). "the labels are flaking" is the keeper's telegraph relayed in the foreman's voice, with no hint to the player and no course fact in that clause. `set-actor-state` is confirmed in shared-rules.md §5; the quiz returns the actor to `actorstate-ready` on `quiz-ended` (npcs.md §6), though the flag persists. It stays askable, and re-issues `quiz-data-types`, until that quiz passes (P5); `quiz-switchyard`'s pass is what opens this beat.

  - id: topic-foreman-predecessor
    actorId: npc-the-foreman
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        Aye, I knew the predecessor. Good with switches, hopeless with fonts — could short out a whole floor and still be smiling. Ask me about them or the lift, and leave the paperwork to me.
      - >-
        That's not on the rota, and the rota does not bend. Switches, then the stair, then whatever the AI wants signed. Ask about the switches.
      - >-
        Don't worry about the last pupil. Worry about the gauge in your hand; it tells the truth before anyone does.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about the predecessor, or the switches.)
    authoring:
      note: >-
        Free-text fallback for the foreman (C2). The registry has no `topic-foreman-default`, so this always-active topic covers unmatched input rather than inventing an ID.

  - id: topic-foreman-show-gauge
    actorId: npc-the-foreman
    match: { kind: show, itemIds: [item-switch-gauge] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        Bore da. Let me have the gauge a moment — I'll log it against the register, needle and all, then get back to the belt.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: overflow-checked, value: true }
    prompt: >-
      (You could ask the foreman to check the gauge.)
    authoring:
      note: >-
        Owns `overflow-checked` for `puzzle-check-the-overflow-register` (topic file §5). Always active: `show` addresses the foreman by his global alias from any room, with no gate on `actorstate-foreman-helpful`, which is a one-off presentational state cleared on `quiz-ended`. No course fact is asserted here.

  - id: topic-foreman-show-lens
    actorId: npc-the-foreman
    match: { kind: show, itemIds: [item-pixel-lens] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        Aye, the glass grid — it catches the light in squares. Leave it with me; I'll file it with the badge measurements and you can carry on.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: badge-scaled, value: true }
    prompt: >-
      (You could ask the foreman to look at the lens.)
    authoring:
      note: >-
        Owns `badge-scaled` for `puzzle-scale-the-badge` (topic file §5). Always active via the foreman's global alias, with no gate on `actorstate-foreman-helpful`. No course fact or answer is given.

  - id: topic-foreman-show-fork
    actorId: npc-the-foreman
    match: { kind: show, itemIds: [item-sample-fork] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        The fork's in tune; I can hear it humming. I'll take the reading off your hands and write it in the ledger.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: bit-rate-counted, value: true }
    prompt: >-
      (You could ask the foreman to take the fork's reading.)
    authoring:
      note: >-
        Owns `bit-rate-counted` for `puzzle-count-the-bit-rate` (topic file §5). Always active via the foreman's global alias, with no gate on `actorstate-foreman-helpful`. No figure or answer is supplied.

  - id: topic-foreman-show-nibble
    actorId: npc-the-foreman
    match: { kind: show, itemIds: [item-hex-nibble-card] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        That card again, corners worn from handling. I'll mark the shelf capacity while you get on with the stacking.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: capacity-labelled, value: true }
    prompt: >-
      (You could ask the foreman to note the nibble card.)
    authoring:
      note: >-
        Owns `capacity-labelled` for `puzzle-label-the-capacity` (topic file §5). Always active via the foreman's global alias, with no gate on `actorstate-foreman-helpful`. No capacity figure is supplied.

  - id: topic-clerk-bases
    actorId: npc-nibble-clerk
    match: { kind: askTell, objectIds: [number-conversion] }
    isActive: { kind: not, of: { kind: npc-knows, actorId: npc-nibble-clerk, topicId: number-conversion } }
    responses:
      - >-
        Columns of four, please. Denary, binary and hexadecimal are three ways of writing the same value, each in its own tidy row. Your card is divided into groups of four; its back says read the nibbles before the east door opens. Read them.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-nibble-clerk, topicId: number-conversion }
    prompt: >-
      (You could ask how the three bases line up.)
    authoring:
      note: >-
        Method only: no worked 37/D5/A5 equivalents. Two clues for `hex-read`: the card's four-square groups and its stamped back (N6).

  - id: topic-clerk-carries
    actorId: npc-nibble-clerk
    match: { kind: askTell, objectIds: [number-conversion] }
    isActive: { kind: all, of: [{ kind: npc-knows, actorId: npc-nibble-clerk, topicId: number-conversion }, { kind: flag-set, flag: switches-set }, { kind: not, of: { kind: flag-set, flag: carries-added } }, { kind: not, of: { kind: flag-set, flag: clerk-carry-heard } }] }
    responses:
      - >-
        Columns of four, please. The rule card reads '1 + 1 = 0, carry 1', in ink still sharp. Put the token in the rightmost column; whatever is left moves to the next column along. Tidy.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: clerk-carry-heard, value: true }
    prompt: >-
      (You could ask what the carry token does.)
    authoring:
      note: >-
        The rule wording is the spec's own; no worked addition beyond it. Second beat on `number-conversion`, so it gates on the puzzle flag `switches-set` that opens the deck rather than on `npc-knows` (C3); no `learn-topic` here, so the carry beat adds no knowledge; the first beat's gate is unchanged. C7 ladder: records `clerk-carry-heard`, so `topic-clerk-shifts` can require it.

  - id: topic-clerk-shifts
    actorId: npc-nibble-clerk
    match: { kind: askTell, objectIds: [number-conversion] }
    isActive: { kind: all, of: [{ kind: npc-knows, actorId: npc-nibble-clerk, topicId: number-conversion }, { kind: flag-set, flag: carries-added }, { kind: flag-set, flag: clerk-carry-heard }, { kind: not, of: { kind: quiz-passed, quizId: quiz-number-systems } }] }
    responses:
      - >-
        Columns of four, please. The gutter has arrow notches and a question card; the answers are yours to supply. An arithmetic shift moves the row the way the notch points; decide what happens when overflow puts a bit past the end, and when underflow drops one off the other end. Then the audit.
    strategy: { kind: sequence }
    effects:
      - { kind: start-quiz, quizId: quiz-number-systems, actorId: npc-nibble-clerk }
    prompt: >-
      (You could ask which way the arithmetic shift goes, or take the number audit.)
    authoring:
      note: >-
        "arithmetic shift", "overflow" and "underflow" sit beside the plain glosses (PCK-TERM); no worked number exists in the guidance (topic file §6). Third beat on `number-conversion`, gated on the puzzle flag `carries-added` rather than `npc-knows` so it stays reachable (C3). Post-quiz state: `actorstate-ready` on `quiz-ended`; this card sets no different state in the quiz. C7 ladder: requires `clerk-carry-heard`, so it never competes with the carry beat or the shift-introduction beat. The `not quiz-passed quiz-number-systems` term keeps the handoff askable after a failed attempt and retires it on the pass (P5).

  - id: topic-clerk-bases-known
    actorId: npc-nibble-clerk
    match: { kind: askTell, objectIds: [number-conversion] }
