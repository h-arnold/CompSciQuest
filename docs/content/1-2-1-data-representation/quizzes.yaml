kind: quiz
areaId: 1-2-1-data-representation
status: approved
topicIds: [switch-to-bit, data-types, number-conversion, character-representation, graphics-representation, sound-representation, data-storage-units, data-compression]

quizzes:
  - id: quiz-switchyard
    actorId: npc-the-foreman
    topicId: switch-to-bit
    score: 0
    questionIds: [q-dr-01, q-dr-02, q-dr-03]
    passMark: 2
    onPass:
      - { kind: complete-topic, topicId: switch-to-bit }
      - { kind: set-flag, flag: quiz-passed:quiz-switchyard, value: true }
      - { kind: message, text: "The foreman checks the switch you set, nods once and signs the maintenance sheet. He caps the pen, listens to the click of the belt, and lets it stand. 'Paperwork's done. Stair's open.' The way up to the Binary Hall waits where it always was." }
    onFail:
      - { kind: change-lives, delta: 0, reason: "the foreman charges nothing for a rehearsal on the switch floor" }
      - { kind: move-player, roomId: room-switch-floor, reason: "the gauge and the rehearsal switches are back on the switch floor" }
      - { kind: message, text: "The foreman writes the slip on a scrap of paper and pockets it without reading it back. 'Again, when you're ready.' The belt keeps its patient click, its needles resting where the rehearsal left them." }
    hintSequenceId: hint-switchyard
    authoring:
      framing: >-
        N3 — the foreman needs the switch described in writing before he will sign the AI's "paperwork"; a challenge on his own floor, never a stop-and-answer. Awareness depth only (§1.1.1), score 0 and no life loss (topic file §6). Delta 0 and the switch-floor return are the approved prologue exception to the normal level-start fail path (difficulty-and-fairness.md); flagged for the editor against the generic "declared level start" wording.

