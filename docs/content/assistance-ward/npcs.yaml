kind: npc
areaId: assistance-ward
status: approved
topicIds: [tutorial-mechanics]

authoring:
  conventions:
    - >-
      Every ID and alias is copied from the root bible §9 registry or the approved
      Assistance Ward topic file. The four pupil actors start in the existing global
      actorstate-ready; that state and npc-the-ai remain declared in the arrival card.
    - >-
      Each ward topic and node carries actorId. Locality appears only in isActive as
      in-room or in-area. The AI's ward catch-all is area-scoped; each pupil's
      catch-all is scoped to that pupil's home room (C6).
    - >-
      No beat uses npc-knows or learn-topic. Progression is gated by the approved
      recovery, quiz-pass and puzzle-solve conditions, so no knowledge AltTopic is
      required; the fixed evidence remains independently examinable (C3).
    - >-
      Every actor has a free-text catch-all. Pre- and post-recovery defaults are
      complementary on their recovery flags. The pupils' object-addressed recovery
      topics do not overlap. Priya additionally has an explicit tell reason
      producer, mutually exclusive with her audit-card entry/resume topic on
      priya-choice-taken and node-priya-choice (C2, C7).
    - >-
      SHOW and GIVE both transfer a carried item whenever a topic is selected,
      including a selected default. No suppression field, self-transfer effect or
      non-transferring-show workaround is authored. Required fixtures are fixed.
      The practice key and block are the intended practice props; any carried item,
      including the tally token, is handed over by SHOW or GIVE.
    - >-
      The four recovery flags and Priya's intermediate choice flag each have
      exactly one producer in this card. The quiz-pass flag,
      assistance-dial-calibrated and tutorial-complete are not written here.
    - >-
      node-priya-choice is sticky because the approved recovery deliberately needs
      a choose-then-justify exchange. There is no turn timeout; bye, leaving Records
      or another enter-node ends it safely. Re-entry resumes at the unfinished step
      (C4).
    - >-
      topic-ai-ward-quiz uses a repeatable strategy so a failed attempt can be
      retried. The approved quiz's onPass and onFail effects restore
      actorstate-ai-reluctant-guide after quiz-ended; this card does not assume the
      AI's arrival initial state is restored.

actors:
  - id: npc-nia
    aliases: [nia]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Former pupil in Intake Bay who needs to make one independent observation.
      voice: >-
        Hesitant and over-literal; asks for a label before trusting her own eyes.
      motivation: >-
        Complete one observation without the AI naming the detail first.
      relationship: >-
        Treats the AI's prompts as orders and learns that looking is an action she
        can take herself.
      verbalTic: >-
        "Am I meant to...?"
      topics: >-
        topic-nia-default, topic-nia-recovered-default, topic-nia-observation.

  - id: npc-mateo
    aliases: [mateo]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Former pupil in Demonstration Ward who needs to read one short instruction.
      voice: >-
        Careful with speech and defeated by print; reads aloud only at his own pace.
      motivation: >-
        Read one instruction himself without the AI finishing his sentences.
      relationship: >-
        Resents the AI's habit of completing a line and needs space to finish it.
      verbalTic: >-
        "One line at a time."
      topics: >-
        topic-mateo-default, topic-mateo-recovered-default, topic-mateo-instruction.

  - id: npc-priya
    aliases: [priya]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Former pupil in Records Office who needs to justify one choice.
      voice: >-
        Fast guesses followed by doubt; cheerful when a reason holds.
      motivation: >-
        Make one choice and give a reason she can check again.
      relationship: >-
        Competes with the AI's instant answers and discovers that a reason can be
        tested rather than guessed.
      verbalTic: >-
        "Wait — what did I check?"
      topics: >-
        topic-priya-default, topic-priya-recovered-default, topic-priya-choice-start,
        topic-priya-choice-made, topic-priya-choice-reason.

  - id: npc-kofi
    aliases: [kofi]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Former pupil in Demonstration Ward who needs to complete one mechanism cycle.
      voice: >-
        Practical and optimistic; trusts visible steps more than reassurance.
      motivation: >-
        Complete one harmless cycle by following what he can see.
      relationship: >-
        Opposes the AI's preference for instant results and asks for a visible
        sequence instead.
      verbalTic: >-
        "Show me the turn."
      topics: >-
        topic-kofi-default, topic-kofi-recovered-default, topic-kofi-practice-cycle.

actorStates:
  - id: actorstate-ai-reluctant-guide
    stateDesc: >-
      The AI's indicator light burns a tired amber while its pointer rests on a
      ward clipboard.
    specialDesc: >-
      The AI waits beside the directory with the air of a clerk supervising an
      unavoidable inspection.
    authoring:
      note: >-
        Weary administrative presence, not a threat. Every ward AI topic reapplies
        this state; no onEnter or onExit effects are declared.

  - id: actorstate-nia-observant
    stateDesc: >-
      Nia stands beside the observation card and points to its chipped corner without
      looking towards the AI.
    specialDesc: >-
      Nia compares the chipped corner with the light and writes the detail herself.
    authoring:
      note: >-
        Presentational recovery state; the canonical recovery flag remains the
        progress gate.

  - id: actorstate-mateo-reading
    stateDesc: >-
      Mateo keeps the instruction card level and tracks each printed word with a
      fingertip.
    specialDesc: >-
      Mateo reads at his own pace, leaving a pause before the final word.
    authoring:
      note: >-
        Presentational recovery state; the canonical recovery flag remains the
        progress gate.

  - id: actorstate-priya-reasoning
    stateDesc: >-
      Priya holds her chosen word beside the audit card and taps the evidence with
      one finger.
    specialDesc: >-
      Priya glances from her written reason to the card, then nods.
    authoring:
      note: >-
        Presentational recovery state; the canonical recovery flag remains the
        progress gate.

  - id: actorstate-kofi-cycling
    stateDesc: >-
      Kofi's hands follow the practice crank's visible sequence and settle after one
      complete turn.
    specialDesc: >-
      Kofi watches the two chalk marks meet and lets the wheel come to rest.
    authoring:
      note: >-
        Presentational recovery state; the canonical recovery flag remains the
        progress gate.

conversationTopics:
  - id: topic-ai-ward-default
    actorId: npc-the-ai
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: in-area
      worldId: world-wjec-gcse-computer-science-2025-spec
      areaId: area-assistance-ward
    responses:
      - >-
        The AI checks its clipboard, then lets its pointer sink. 'The pupil has
        reached the Assistance Ward. The ward will now demonstrate the controls,
        because apparently the route signage was insufficient.' When you speak to
        someone here, showing or giving them an item hands it over, even if they
        answer with a general reply. The record announces a hand-over the moment
        it happens.
      - >-
        A stamped form slides under the pointer. 'Questions are accepted. Corrections
        are also accepted, provided they arrive in the approved order.' Fixed ward
        fixtures stay put. The practice key and block are the intended practice
        props; any carried item, including the tally token, is handed over if you
        show or give it.
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI about the ward tour.)
    authoring:
      note: >-
        Area-scoped free-text DefaultAskTellTopic for the AI inside the ward (C2,
        C6). It describes the landed SHOW/GIVE transfer behaviour, including selected
        defaults, and states that the transfer is announced at the moment it happens;
        the code owner owns the announcement text. The arrival-card amendment excludes
        the ward from topic-ai-default; the landed selector then chooses this active
        scoped default.

  - id: topic-ai-ward-intake
    actorId: npc-the-ai
    match:
      kind: special
      keywords:
        [
          look,
          examine,
          take,
          drop,
          inventory,
          score,
          help,
          movement,
          go,
          direction,
        ]
    isActive: { kind: in-room, roomId: room-assistance-intake }
    responses:
      - >-
        The AI indicates the room with a limp flourish. 'Look takes in the room;
        examine names one thing for a closer description. Take the tally token to
        carry it, drop to set it down, and inventory to check what the pupil carries.
        A direction on its own, or go followed by one, moves between rooms. Score is
        zero throughout this ward, and help lists the available controls.'
      - >-
        'The tally token is only for carrying practice,' the AI adds. 'No ward
        progress depends on keeping it. The pupil may look or examine again at any
        time.'
    strategy: { kind: sequence }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI about carrying and movement.)
    authoring:
      note: >-
        Intake-only command lesson. It teaches look/examine, take/drop/inventory,
        directions, zero score and help without adding a search command or a new
        mechanic.

  - id: topic-ai-ward-demonstration
    actorId: npc-the-ai
    match:
      kind: special
      keywords:
        [
          use,
          put,
          open,
          close,
          unlock,
          give,
          show,
          key,
          cabinet,
          block,
          bell,
          crank,
        ]
    isActive: { kind: in-room, roomId: room-assistance-demonstration }
    responses:
      - >-
        The AI points at the practice cabinet. 'Use applies an action that an object
        supports. First, unlock practice key with practice cabinet. Then open and
        close the door. Use put to place the block inside, and reserve the block for
        PUT practice. After unlocking, the key is the intended prop for optional
        hand-over practice. The fixed cards, cabinet and crank stay where they are.'
      - >-
        'When you speak to someone here, showing or giving them an item hands it over,
        even if they answer with a general reply. The practice key and block are the
        intended practice props. Any carried item, including the tally token, is
        handed over in the same way.'
    strategy: { kind: sequence }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI about practice objects and doors.)
    authoring:
      note: >-
        Demonstration-only object lesson. It states the automatic transfer on SHOW
        and GIVE accurately and adds no transfer-suppression workaround. It does not
        claim that a deferred fixture interaction has landed.

  - id: topic-ai-ward-records
    actorId: npc-the-ai
    match:
      kind: special
      keywords: [records, record, paperwork]
    isActive: { kind: in-room, roomId: room-assistance-records }
    responses:
      - >-
        The AI gestures towards the shelves without lifting its pointer. 'Records
        Office. The recovery board lists the five entries and the audit card sits
        beside it. Ask about the conversation controls, answering, hints, failure
        or saving and each will be explained in its own turn.'
      - >-
        'One subject at a time,' it adds. 'The board and the card are not a single
        question. Name the part that needs explaining and I shall deal with it.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI about the Records Office, the board or the audit card.)
    authoring:
      note: >-
        Records-only special topic for the obvious question word. Its keyword set
        (records, record, paperwork) is distinct from the five sibling keyword topics.
        It gives a short weary framing of the room, board and card and signposts the
        siblings; it grants no flag, quiz or progress (C1, C2, C6).

  - id: topic-ai-ward-conversation
    actorId: npc-the-ai
    match:
      kind: special
      keywords: [talk, talk-to, ask, tell, bye, conversation]
    isActive: { kind: in-room, roomId: room-assistance-records }
    responses:
      - >-
        'Talk-to opens a conversation; ask and tell address a subject; bye ends it,'
        the AI says without looking up. 'A simple arrangement. It needs no further
        commentary from me.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI how to talk, ask, tell or say bye.)
    authoring:
      note: >-
        Carries the original conversation-verb teaching. Its keyword set (talk,
        talk-to, ask, tell, bye, conversation) is distinct from its siblings; special
        keyword topics sit outside the C7 free-text overlap proof (C2, C6).

  - id: topic-ai-ward-answers
    actorId: npc-the-ai
    match:
      kind: special
      keywords: [answer, answers, quiz answers, how to answer, option]
    isActive: { kind: in-room, roomId: room-assistance-records }
    responses:
      - >-
        'In the audit, answer N uses the number shown beside an option, starting at
        1,' says the AI. 'A bare N or the exact option text is also accepted. The
        pupil may use whichever form is easiest.'
      - >-
        The pointer taps the four-box form. 'The boxes are numbered from 1. That is
        the whole of the answer format; I shall not be supplying the answer itself.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI how to answer a quiz question.)
    authoring:
      note: >-
        Carries the original answer-form teaching: answer N, a bare N, exact option
        text and numbering from 1. The phrases quiz answers and how to answer are
        addressed here, never by topic-ai-ward-quiz. No correct option is named (C2,
        N3).

  - id: topic-ai-ward-hints
    actorId: npc-the-ai
    match:
      kind: special
      keywords: [hint, hints, stuck]
    isActive: { kind: in-room, roomId: room-assistance-records }
    responses:
      - >-
        'Use the hint command for help from the ward's hint system; it is separate
        from asking or telling the AI,' the AI says. 'It nudges without naming the
        answer, costs no score and has a short cooldown between prompts.'
      - >-
        'The system will not think for the pupil,' it adds. 'Ask it when stuck; it
        will point at the evidence and leave the decision where it belongs.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI what a hint does.)
    authoring:
      note: >-
        Carries the original hint teaching: a separate command that nudges without
        giving the answer, costs no score and has a cooldown. Distinct keywords; no
        answer is supplied here (H2, H3, C2).

  - id: topic-ai-ward-failure
    actorId: npc-the-ai
    match:
      kind: special
      keywords: [fail, failure, lives, retry, no life]
    isActive: { kind: in-room, roomId: room-assistance-records }
    responses:
      - >-
        'A failed ward attempt costs no life and does not move the pupil; retries
        are unlimited,' the AI says. 'Ward scores remain zero. The paperwork is
        remarkably forgiving.'
      - >-
        'Start again as often as needed,' it adds. 'The record notes another
        attempt. Nothing is lost except time.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI what happens after a failed attempt or a lost life.)
    authoring:
      note: >-
        Carries the original zero-life, no-movement and unlimited-retry teaching.
        Distinct keywords; changes no flag, life or score (P5, C2).

  - id: topic-ai-ward-save
    actorId: npc-the-ai
    match:
      kind: special
      keywords: [save, saving, load, download, import, restart]
    isActive: { kind: in-room, roomId: room-assistance-records }
    responses:
      - >-
        'Save and load use the browser's own storage. Download creates a portable
        save file; import restores one. Restart replaces the current game,' the AI
        recites. 'No ward progress depends on using a destructive control or opening
        a file picker.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI about saving, loading or restarting.)
    authoring:
      note: >-
        Carries the original manual browser-storage and portable-file teaching. It
        promises no undo, autosave or save slot and makes no progress depend on a
        destructive or file-picker control (content-rules.md §8, C2).

  - id: topic-ai-ward-quiz
    actorId: npc-the-ai
    match:
      {
        kind: special,
        keywords:
          [orientation, audit, test, practice test, start quiz, begin quiz],
      }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-records }
        - { kind: flag-set, flag: nia-observation-recovered }
        - { kind: flag-set, flag: mateo-reading-recovered }
        - { kind: flag-set, flag: priya-reasoning-recovered }
        - { kind: flag-set, flag: kofi-operation-recovered }
        - {
            kind: not,
            of: { kind: quiz-passed, quizId: quiz-assistance-orientation },
          }
    responses:
      - >-
        The AI draws a four-box form and underlines three of them. 'The orientation
        audit requires three correct answers out of four. It scores zero. A failed
        attempt costs no life and does not move the pupil; retries are unlimited.
        The pupil may begin whenever all four recovery records are complete.'
      - >-
        'Another audit form,' the AI says, with elaborate reluctance. 'Three of four
        passes; a failed attempt costs no life and does not move the pupil. Retry as
        often as the paperwork requires.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
      - kind: start-quiz
        quizId: quiz-assistance-orientation
        actorId: npc-the-ai
    prompt: >-
      (You could ask the AI for the orientation, the audit or a practice test.)
    authoring:
      note: >-
        Repeatable after failure because the strategy is rotating, not once. All four
        recovery flags gate the handoff; quiz-passed retires it. The state effect
        precedes start-quiz. The approved quiz's onPass and onFail effects restore
        actorstate-ai-reluctant-guide after quiz-ended. The audit starts only when
        asked by orientation, audit, test, practice test or an explicit start or begin
        request; answer-format questions such as quiz answers are handled by
        topic-ai-ward-answers and never start the quiz. Another AI question must not
        reset a quiz already in progress; the runtime owner implements that guard.

  - id: topic-ai-ward-calibration
    actorId: npc-the-ai
    match:
      {
        kind: special,
        keywords: [calibration, dial, dark sockets, empty sockets],
      }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-records }
        - { kind: quiz-passed, quizId: quiz-assistance-orientation }
        - {
            kind: not,
            of: { kind: puzzle-solved, puzzleId: puzzle-calibrate-assistance },
          }
    responses:
      - >-
        The AI turns the recovery board so the pupil can read it. 'OBSERVE, READ,
        REASON, OPERATE and ORIENTATION PASS. The dial's sockets stay dark until all
        five records agree. The teaching ports remain closed while those sockets are
        empty.'
      - >-
        'The dial carries the same five labels. Compare them with the recovery board
        and decide the adjustment. The AI will observe the paperwork; the pupil
        supplies the action.'
    strategy: { kind: sequence }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI about calibration.)
    authoring:
      note: >-
        Records-only post-quiz lesson. It restates the goal, dark sockets, recovery
        board and dial labels without supplying the final action or adjustment.

  - id: topic-ai-ward-complete
    actorId: npc-the-ai
    match:
      {
        kind: special,
        keywords: [ward complete, orientation complete, finished, ports open],
      }
    isActive:
      kind: all
      of:
        - kind: in-area
          worldId: world-wjec-gcse-computer-science-2025-spec
          areaId: area-assistance-ward
        - { kind: puzzle-solved, puzzleId: puzzle-calibrate-assistance }
    responses:
      - >-
        The AI stamps the ward record with a sigh that lasts slightly too long.
        'Calibration recorded. The teaching-zone ports are open.'
      - >-
        The pointer circles the completed form. 'The ward is complete. The east and
        north teaching routes are live; the pupil may leave by the usual exits.'
    strategy: { kind: rotating }
    effects:
      - kind: set-actor-state
        actorId: npc-the-ai
        stateId: actorstate-ai-reluctant-guide
    prompt: >-
      (You could ask the AI whether the ward is finished.)
    authoring:
      note: >-
        Area-scoped confirmation after puzzle-calibrate-assistance is solved. It
        changes no route, flag, score or item.

  - id: topic-nia-default
    actorId: npc-nia
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-intake }
        - { kind: not, of: { kind: flag-set, flag: nia-observation-recovered } }
    responses:
      - >-
        Nia stands beside the observation card. 'Am I meant to read the label first,
        or look at the card? What if I look at the wrong detail?'
      - >-
        Nia glances towards the doorway, then looks back at the card. 'Do I wait for
        the AI to tell me what I saw?'
      - >-
        'Observation card,' she reads slowly. 'Is that the thing to examine, or
        another instruction?'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask Nia about the observation card.)
    authoring:
      note: >-
        Intake-scoped pre-recovery DefaultAskTellTopic. Its recovery-flag negation
        complements topic-nia-recovered-default (C2, C6, C7).

  - id: topic-nia-recovered-default
    actorId: npc-nia
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-intake }
        - { kind: flag-set, flag: nia-observation-recovered }
    responses:
      - >-
        Nia points to the card's chipped corner without waiting to be told. 'That
        edge is damaged. I saw it myself.'
      - >-
        'I don't need the AI to name the detail first. I can look, then say what I
        noticed.'
      - >-
        Nia traces the chipped corner in the air, then writes it down. 'That one is
        mine.'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask Nia what she noticed.)
    authoring:
      note: >-
        Intake-scoped post-recovery DefaultAskTellTopic. The flag condition is the
        complement of topic-nia-default (C2, C6, C7).

  - id: topic-nia-observation
    actorId: npc-nia
    match: { kind: askTell, objectIds: [item-assistance-observation-card] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-intake }
        - { kind: not, of: { kind: flag-set, flag: nia-observation-recovered } }
    responses:
      - >-
        Nia studies the observation card. 'That corner is chipped.' She compares the
        broken edge with the light, then writes the detail herself. 'I noticed that.
        The AI didn't tell me.'
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: nia-observation-recovered, value: true }
      - kind: set-actor-state
        actorId: npc-nia
        stateId: actorstate-nia-observant
    prompt: >-
      (You could ask Nia about the observation card.)
    authoring:
      note: >-
        The sole producer of nia-observation-recovered. Nia independently notices
        the observation card's chipped corner and records it within the same
        response. The response does not claim a tracked examine action or a second
        player reply; the fixture is fixed and possession is irrelevant.

  - id: topic-mateo-default
    actorId: npc-mateo
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-demonstration }
        - { kind: not, of: { kind: flag-set, flag: mateo-reading-recovered } }
    responses:
      - >-
        Mateo squares the instruction card with the edge of the desk. 'One line at a
        time. If I start before I'm ready, the AI will finish it for me.'
      - >-
        'Four words,' he says, then stops. 'No. Four instructions. I want to read
        them myself.'
      - >-
        His finger rests below the first printed word. 'Don't say it yet. Let me get
        there.'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask Mateo about the instruction card.)
    authoring:
      note: >-
        Demonstration-scoped pre-recovery DefaultAskTellTopic. Its recovery-flag
        negation complements topic-mateo-recovered-default (C2, C6, C7).

  - id: topic-mateo-recovered-default
    actorId: npc-mateo
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-demonstration }
        - { kind: flag-set, flag: mateo-reading-recovered }
    responses:
      - >-
        Mateo reads the card at his own pace. 'UNLOCK. OPEN. PLACE. CLOSE. I kept my
        place that time.'
      - >-
        He taps each printed word once. 'The instruction didn't need finishing. It
        needed space.'
      - >-
        Mateo leaves a deliberate pause before the last word. 'One line at a time.'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask Mateo what he read.)
    authoring:
      note: >-
        Demonstration-scoped post-recovery DefaultAskTellTopic. The flag condition
        is the complement of topic-mateo-default (C2, C6, C7).

  - id: topic-mateo-instruction
    actorId: npc-mateo
    match: { kind: askTell, objectIds: [item-assistance-instruction-card] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-demonstration }
        - { kind: not, of: { kind: flag-set, flag: mateo-reading-recovered } }
    responses:
      - >-
        Mateo steadies the fixed instruction card. 'UNLOCK, OPEN, PLACE, CLOSE.'
        He stops after each word, waiting for an interruption. None comes. 'That is
        the whole instruction. I read it myself.'
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: mateo-reading-recovered, value: true }
      - kind: set-actor-state
        actorId: npc-mateo
        stateId: actorstate-mateo-reading
    prompt: >-
      (You could ask Mateo about the instruction card.)
    authoring:
      note: >-
        The sole producer of mateo-reading-recovered. Mateo reads the fixed text
        exactly as UNLOCK, OPEN, PLACE, CLOSE, and the AI does not finish it for him.
        The fixture is fixed and possession is irrelevant.

  - id: topic-kofi-default
    actorId: npc-kofi
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-demonstration }
        - { kind: not, of: { kind: flag-set, flag: kofi-operation-recovered } }
    responses:
      - >-
        Kofi holds his hands above the crank without touching it. 'Show me the turn.
        I'll follow it.'
      - >-
        'I can see the handle and the chalk mark. I want to know where the cycle
        starts and ends before I move.'
      - >-
        'Tell me it is simple and I will worry. Show me the sequence and I will try
        it.'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask Kofi about the practice crank.)
    authoring:
      note: >-
        Demonstration-scoped pre-recovery DefaultAskTellTopic. Its recovery-flag
        negation complements topic-kofi-recovered-default (C2, C6, C7).

  - id: topic-kofi-recovered-default
    actorId: npc-kofi
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-demonstration }
        - { kind: flag-set, flag: kofi-operation-recovered }
    responses:
      - >-
        Kofi checks the two chalk marks, then follows one full turn. 'Start here,
        finish here. I can repeat that.'
      - >-
        He lets the wheel settle. 'One complete cycle. Nothing rushed.'
      - >-
        Kofi points to the mark on the housing. 'That is where I check my work.'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask Kofi about the cycle.)
    authoring:
      note: >-
        Demonstration-scoped post-recovery DefaultAskTellTopic. The flag condition
        is the complement of topic-kofi-default (C2, C6, C7).

  - id: topic-kofi-practice-cycle
    actorId: npc-kofi
    match: { kind: askTell, objectIds: [item-assistance-practice-crank] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-demonstration }
        - { kind: not, of: { kind: flag-set, flag: kofi-operation-recovered } }
    responses:
      - >-
        Kofi examines the fixed crank's handle and the chalk mark on its housing.
        'One full turn brings the two marks together.' He guides the handle through
        one harmless cycle and watches the wheel settle. 'Start, turn, finish. I did
        the whole sequence.'
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: kofi-operation-recovered, value: true }
      - kind: set-actor-state
        actorId: npc-kofi
        stateId: actorstate-kofi-cycling
    prompt: >-
      (You could ask Kofi about the practice crank.)
    authoring:
      note: >-
        The sole producer of kofi-operation-recovered. Kofi examines the fixed
        crank's visible sequence and completes one harmless cycle in the fiction.
        The response does not claim a runtime crank action; the fixture is fixed and
        possession is irrelevant.

  - id: topic-priya-default
    actorId: npc-priya
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-records }
        - { kind: not, of: { kind: flag-set, flag: priya-reasoning-recovered } }
    responses:
      - >-
        Priya taps the audit card, then the empty line beneath it. 'Ask me about
        the audit card to start or resume. If no choice exists yet, ask me CHECKED
        or ASSUMED. Once I have chosen, tell me in your own words what I checked
        and what it showed.'
      - >-
        Priya holds her pencil above the card. 'Ask me about the audit card if we
        need to start or resume. No choice yet? Ask me CHECKED or ASSUMED. Choice
        made? Tell me in your own words what I checked and what it showed. That is
        the part I must not guess.'
      - >-
        'Wait — what did I check?' Priya points at the two choices. 'Ask me about
        the audit card to enter or resume. If there is no choice yet, ask me CHECKED
        or ASSUMED. Once there is a choice, tell me in your own words what I checked
        and what it showed.'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (Ask Priya about the audit card to enter or resume. If no choice exists, ask
      her CHECKED or ASSUMED; once she has chosen, tell her in your own words what
      was checked and what it showed.)
    authoring:
      note: >-
        Records-scoped, non-producing DefaultAskTellTopic and the default inside
        node-priya-choice. The responses and prompt are state-neutral: they direct
        the player to ask about the audit card to enter or resume, offer CHECKED or
        ASSUMED only when no choice exists, and request the tell reason in the
        player's own words once a choice exists, without implying a fixed phrase.
        The topic grants no choice or recovery progress; topic-priya-choice-reason
        remains the sole recovery producer. It is complementary with the recovered
        default on priya-reasoning-recovered (C2, C4, C6, C7).

  - id: topic-priya-recovered-default
    actorId: npc-priya
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-records }
        - { kind: flag-set, flag: priya-reasoning-recovered }
    responses:
      - >-
        Priya keeps one finger beside her chosen word. 'I chose it, and I can put
        what I checked and what it showed into my own words.'
      - >-
        'Wait — I can test that reason again.' She smiles. 'That's better than being
        fast.'
      - >-
        Priya turns the card towards you. 'The reason is mine. The AI didn't supply
        it.'
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask Priya about her reason.)
    authoring:
      note: >-
        Records-scoped post-recovery DefaultAskTellTopic. The flag condition is the
        complement of topic-priya-default (C2, C6, C7).

  - id: topic-priya-choice-start
    actorId: npc-priya
    match: { kind: askTell, objectIds: [item-assistance-audit-card] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-assistance-records }
        - { kind: not, of: { kind: flag-set, flag: priya-reasoning-recovered } }
        - kind: any
          of:
            - { kind: not, of: { kind: flag-set, flag: priya-choice-taken } }
            - {
                kind: not,
                of:
                  {
                    kind: in-node,
                    actorId: npc-priya,
                    nodeId: node-priya-choice,
                  },
              }
    responses:
      - >-
        Priya slides the fixed audit card into view. 'Ask me about the audit card
        to start or resume. If no choice exists yet, ask me CHECKED or ASSUMED. Once
        I have chosen, tell me in your own words what I checked and what it showed.'
    strategy: { kind: rotating }
    effects:
      - kind: enter-node
        actorId: npc-priya
        nodeId: node-priya-choice
    prompt: >-
      (Ask Priya about the audit card to enter or resume. If no choice exists, ask
      her CHECKED or ASSUMED; once she has chosen, tell her in your own words what
      was checked and what it showed.)
    authoring:
      note: >-
        Repeatable entry/resume topic for the sticky teaching node. Its response
        and prompt cover both unfinished states without requesting the retired
        choice after priya-choice-taken: choose CHECKED or ASSUMED only before a
        choice exists, then tell what was checked and what it showed once one
        exists. Before priya-choice-taken it enters the node. After the choice it
        is inactive inside the node, so an ordinary tell reaches
        topic-priya-choice-reason; outside the node it remains active so asking
        about the audit card resumes the unfinished exchange. These conditions
        make it mutually exclusive with the reason producer (C7). The fixed card
        cannot be carried away.

  - id: topic-priya-choice-made
    actorId: npc-priya
    match: { kind: special, keywords: [checked, check, assumed, assume] }
    isActive:
      kind: all
      of:
        - { kind: in-node, actorId: npc-priya, nodeId: node-priya-choice }
        - { kind: not, of: { kind: flag-set, flag: priya-choice-taken } }
    responses:
      - >-
        Priya writes the word you chose beside the card. 'Done. No — done isn't a
        reason.' She looks up. 'Tell me in your own words what I checked and what it
        showed.'
      - >-
        Priya taps her chosen word twice. 'That is my choice. Now I have to say, in
        my own words, what I checked and what it showed, or I am only guessing
        again.'
    strategy: { kind: rotating }
    effects:
      - { kind: set-flag, flag: priya-choice-taken, value: true }
    prompt: >-
      (Tell Priya in your own words what you checked and what it showed.)
    authoring:
      note: >-
        Accepts either printed choice through ask and is the sole producer of
        priya-choice-taken. It records the choice without granting the recovery
        flag. The next step uses tell for what Priya checked and what it showed;
        after priya-choice-taken this topic is inactive and cannot intercept a
        reason containing "checked" or "assumed".

  - id: topic-priya-choice-reason
    actorId: npc-priya
    match: { kind: tell, objectIds: [] }
    isActive:
      kind: all
      of:
        - { kind: in-node, actorId: npc-priya, nodeId: node-priya-choice }
        - { kind: flag-set, flag: priya-choice-taken }
        - { kind: not, of: { kind: flag-set, flag: priya-reasoning-recovered } }
    responses:
      - >-
        Priya listens, then writes your reason beside her choice. 'Yes. That is what
        I checked and what it showed, in my own words. I can point to it again.'
        She looks up, cheerful.
      - >-
        Priya reads the reason back, then sets down the pencil. 'I said it my own
        way and it still holds. That is something I can check again.' Her doubt
        gives way to a grin.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: priya-reasoning-recovered, value: true }
      - kind: set-actor-state
        actorId: npc-priya
        stateId: actorstate-priya-reasoning
      - { kind: exit-node, actorId: npc-priya }
    prompt: >-
      (Tell Priya in your own words what you checked and what it showed.)
    authoring:
      note: >-
        Explicit non-default tell producer and the sole producer of
        priya-reasoning-recovered. It is active only inside node-priya-choice,
        after priya-choice-taken and before recovery. The prompt and responses
        invite the player's own wording and name no fixed phrase; the runtime owner
        widens post-choice tell matching. The player's post-choice tell is treated
        as the reason; the game records the exchange without claiming to grade
        arbitrary prose. It applies the recovered state and exits the node. talk-to
        and retired ask choices instead reach the non-producing topic-priya-default.

conversationNodes:
  - id: node-priya-choice
    actorId: npc-priya
    isSticky: true
    topicIds:
      [topic-priya-choice-made, topic-priya-choice-reason, topic-priya-default]
    defaultTopicId: topic-priya-default
    authoring:
      note: >-
        Sticky because the approved recovery deliberately requires a choose-then-
        justify exchange. topic-priya-default is the non-producing node default
        before and after priya-choice-taken, so talk-to and retired ask choices
        grant no progress. After the choice, the explicit tell producer
        topic-priya-choice-reason records the player's reason and completes the
        recovery; topic-priya-choice-start is inactive inside the node so it
        cannot shadow that tell. No onEnterEffects are declared and there is no
        turn timeout; bye, leaving Records or another enter-node ends the node
        safely, and asking about the audit card outside it resumes the unfinished
        exchange.
