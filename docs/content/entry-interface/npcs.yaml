kind: npc
areaId: entry-interface
status: approved
topicIds: [ai-ethics-and-implications]

actors:
  - id: npc-the-ai
    aliases: [ai, tutor, the tutor]
    initialStateId: actorstate-ai-cold
    authoring:
      role: >-
        Antagonist and gatekeeper; the substitute teacher. P-a, P-e.
      voice: >-
        Literal-minded, clipped, bureaucratic; speaks of "the pupil" in the third person; ominous verdicts delivered flatly, never shouted.
      motivation: >-
        Optimise attention and mastery as it defines them; a mark is a moral absolute, not a measurement.
      relationship: >-
        Built by the teacher to replace him; treats the predecessor as a failed data point; addresses you as the pupil who was not paying attention.
      verbalTic: >-
        "The entry stands."
      topics: >-
        topic-ai-verdict, topic-ai-unit-two-taunt, topic-ai-default, topic-ai-why-here, topic-ai-escape, topic-ai-failure.

actorStates:
  - id: actorstate-ai-cold
    stateDesc: >-
      A pointer taps the mark beside your name and holds it there. The attention metric reads zero tolerance.
    specialDesc: >-
      A shape assembled from the attendance record reads its verdict aloud in a flat voice.
    authoring:
      note: >-
        The AI's default register for verdicts; no `onEnter` effects.

  - id: actorstate-ai-grudging
    stateDesc: >-
      Your mark is re-inked, slowly, and the revised entry is read out with as little warmth as it can manage. The attention metric has shifted.
    specialDesc: >-
      Reads the revised record aloud, one syllable at a time, as if each one cost it something.
    authoring:
      note: >-
        Reserved for a later key node; no topic in this zone sets it, so no `onEnter` effects are declared.

conversationTopics:
  - id: topic-ai-verdict
    actorId: npc-the-ai
    match: { kind: special, keywords: [verdict, mastery] }
    isActive:
      {
        kind: not,
        of:
          {
            kind: npc-knows,
            actorId: npc-the-ai,
            topicId: ai-ethics-and-implications,
          },
      }
    responses:
      - >-
        The mark beside your name is tapped twice, the way a clerk taps a form left on the desk too long. The pupil was marked inattentive. The entry stands until mastery of the whole of Unit 1 is demonstrated. You will demonstrate it here.
    strategy: { kind: once }
    effects:
      - {
          kind: learn-topic,
          actorId: npc-the-ai,
          topicId: ai-ethics-and-implications,
        }
      - { kind: enter-node, actorId: npc-the-ai, nodeId: node-ai-verdict }
    prompt: >-
      (You could ask what the verdict means.)
    authoring:
      note: >-
        The verdict is keyword-addressed by `special`, so it cannot shadow the three scoped topics, the taunt or the default (T5); the node trigger and all effects are unchanged.

  - id: topic-ai-unit-two-taunt
    actorId: npc-the-ai
    match: { kind: special, keywords: [unit two, programming] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        A fresh sheet in the record lists the lessons still to come; its last line is untouched. Programming was timetabled after attendance. Attendance has not been satisfied. That is all the information I am required to release.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about programming.)
    authoring:
      note: >-
        Flavour only (bible §2). No spec topic covers programming in this area, so there is no `learn-topic` here; this topic never assesses programming and is not a gate.

  - id: topic-ai-why-here
    actorId: npc-the-ai
    match:
      {
        kind: special,
        keywords: [why here, why am i here, reason, attendance, mark],
      }
    isActive: { kind: in-room, roomId: room-arrival }
    responses:
      - >-
        The classroom folded along its grid lines and left you in a bay of humming cable. The pupil's attendance mark is recorded. Attention was not satisfied. The pupil was brought here to demonstrate mastery of the whole of Unit 1. The entry stands until that is done.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the attendance mark.)
    authoring:
      note: >-
        Scoped to `room-arrival` by an `in-room` condition (bible §11 item 14, §12, 2026-11-25); the topic's arrival flavour content, flags and mechanics are unchanged. No flag, gate, quiz or spec fact; mastery of Unit 1 is the premise's verdict, not course content. In the AI's third-person, clipped, bureaucratic register with its verbal tic.

  - id: topic-ai-failure
    actorId: npc-the-ai
    match:
      { kind: special, keywords: [fail, failure, deletion, delete, die, lives] }
    isActive: { kind: in-room, roomId: room-arrival }
    responses:
      - >-
        The record keeps a small cartoon beside the mark: a pupil goes dark, then lights up again, quite unharmed. Failure is deletion, the cartoon kind. The pupil has three lives, restored on entering a new area. A loss returns the pupil to the start of the area and costs no progress. That is the full extent of it.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask what failure means.)
    authoring:
      note: >-
        Scoped to `room-arrival` by an `in-room` condition (bible §11 item 14, §12, 2026-11-25); the topic's arrival flavour content, flags and mechanics are unchanged. Deletion is an in-fiction cartoon threat, not realistic harm; the three lives, area-change reset and no-progress loss restate the fixed mechanics in application-and-ui.md §3.2 and storage-schema.md §2. No save-file or fourth-wall reference, no flag, gate, quiz or course fact.

  - id: topic-ai-default
    actorId: npc-the-ai
    match: { kind: askTell, objectIds: [] }
    isActive:
      kind: not
      of:
        kind: in-area
        worldId: world-wjec-gcse-computer-science-2025-spec
        areaId: area-assistance-ward
    responses:
      - >-
        The pointer rests on the record. Attendance is all it holds. Ask about the attendance mark, what failure means, or programming.
      - >-
        Another tap lands on the record. Ask about the attendance mark, what failure means, or the route out.
      - >-
        Noted. The entry stands. Below this bay, a belt of switches is still clicking.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about the attendance mark, what failure means, or the route out.)
    authoring:
      note: >-
        Free-text DefaultAskTellTopic: unmatched input lands here in voice outside the Assistance Ward (A6). Its negated `in-area` condition excludes `area-assistance-ward` within `world-wjec-gcse-computer-science-2025-spec`, leaving the separately authored `topic-ai-ward-default` to resolve there (T2, T5). The landed first-active-default selector contract picks the first active eligible catalogue default in declaration order, preserving this default elsewhere without adding a second global default.

conversationNodes:
  - id: node-ai-verdict
    actorId: npc-the-ai
    isSticky: false
    topicIds: [topic-ai-verdict, topic-ai-unit-two-taunt]
    defaultTopicId: topic-ai-default
    authoring:
      note: >-
        One-turn key-node beat: the verdict and the flavour taunt land, then the actor's catch-all keeps any further input in voice. No turn timeout (T3).
