  - id: room-arrival
    title: The Arrival Bay
    aliases: [arrival, landing, scan]
    description: >-
      The register lies open, a mark beside your name. The AI reads it in the flat
      voice of a machine that has read it many times: attention not satisfied. The
      classroom folds along its grid lines. The ceiling becomes a row of tiny
      switches; you stand in a bay of humming cable. The AI waits: not a screen,
      not a voice, but a shape assembled from the attendance record. Your mark
      stands. It offers an east route, not a door.
    topicIds: [ai-ethics-and-implications]
    exits:
      - direction: east
        to: room-network-hub
    score: 0
    authoring:
      interesting: A verdict delivered by the very attendance record that made it.

