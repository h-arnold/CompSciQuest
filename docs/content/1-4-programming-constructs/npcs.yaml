  # --- Colour Court: the Shed Opener -----------------------------------------
  - id: topic-shed-opener-selection
    actorId: npc-the-shed-opener
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive: { kind: not, of: { kind: npc-knows, actorId: npc-the-shed-opener, topicId: programming-constructs } }
    responses:
      - >-
        The shed is the gap a loom opens when some threads lift and the rest stay
        down — and which lift, which stay, is the spec's selection. The plate reads
        a condition: if the shade is critical, lift; else keep it down; end if. One
        arm runs. Never both. For a many-way choice the case rail takes over — case
        select, one lane per case. Have the plate's logic straight, then ask me for
        the demonstration.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-the-shed-opener, topicId: programming-constructs }
    prompt: >-
      (You could ask about the missing else.)

  - id: topic-shed-opener-selection-known
    actorId: npc-the-shed-opener
    match: { kind: special, keywords: [next, shed, selection] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-colour-court }
        - { kind: npc-knows, actorId: npc-the-shed-opener, topicId: programming-constructs }
        - { kind: not, of: { kind: flag-set, flag: colours-lifted } }
    responses:
      - >-
        Selection is settled; the court is not. Every pick routes urgent on the
        cousin's plate, because the routine arm of the if is missing. Bring me the
        shed plate and the else plate, and the trays will route by condition again.
        I'll be here, dithering. Say nothing — I know.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask what to lift next.)
    authoring:
      note: >-
        Keyword-addressed T2 AltTopic: after the teaching beat, while the selection
        fix is undone, the beat is reachable as a `special` on [next, shed,
        selection] rather than by free text. It is no longer `askTell` because the
        `special` demonstration must not be shadowed once `isIdMatchingPhrase` is
        removed (npcs.md §3); the V4 trace does not ask this beat. The text points
        at the room's work without giving any answer away.

  - id: topic-shed-opener-demonstration
    actorId: npc-the-shed-opener
    match: { kind: special, keywords: [demonstration, demo, prove it, challenge] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-colour-court }
        - { kind: npc-knows, actorId: npc-the-shed-opener, topicId: programming-constructs }
        - { kind: not, of: { kind: quiz-passed, quizId: quiz-colour-court } }
    responses:
      - >-
        Good. Sit yourself at the pick bench and read each plate as I would: what
        the tray shows, against what the condition asks. Commit only when the
        comparison is settled. Pass, and the Bureau's stamp rides with the
        demonstration; the selection card is issued. Fail, and you are one life
        lighter — the Court is fair, but it is not soft.
      - >-
        Again. The bench takes a second attempt and so do I — dither, though, and I
        will notice. Read each condition exactly, mind the comparison it carries,
        then commit.
    strategy: { kind: rotating }
    effects:
      - { kind: start-quiz, quizId: quiz-colour-court, actorId: npc-the-shed-opener }
    prompt: >-
      (You could ask for the demonstration.)

  - id: topic-shed-opener-mended
    actorId: npc-the-shed-opener
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-colour-court }
        - { kind: npc-knows, actorId: npc-the-shed-opener, topicId: programming-constructs }
        - { kind: flag-set, flag: colours-lifted }
    responses:
      - >-
        Watch the shed lift. Urgent lifts and the routine pile sits flat — each pick
        landing exactly once, exactly where the condition says. That is selection
        working: one condition, one arm. Thank you. Not for me. For the trays.
        Also — slightly — for me. Do not quote that.
    strategy: { kind: once }
    effects:
      - { kind: set-actor-state, actorId: npc-the-shed-opener, stateId: actorstate-shed-opener-sorted }
    prompt: >-
      (You could ask how the trays are running now.)

  - id: topic-shed-opener-urgent
    actorId: npc-the-shed-opener
    match: { kind: special, keywords: [urgent, routine, pile, avalanche, tray] }
    isActive: { kind: in-room, roomId: room-colour-court }
    responses:
      - >-
        Urgent sells, he said, and re-labelled every tray in my court. With the
        routine arm gone, nothing is ever routine, so every pick is stamped urgent
        and the pile grows. Mind the trolley — that pile is one sheet from going
        over, and I would rather you read the labels before it does.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the missing else.)

  - id: topic-shed-opener-give
    actorId: npc-the-shed-opener
    match: { kind: give, itemIds: [item-pattern-card-selection] }
    isActive: { kind: has-item, itemId: item-pattern-card-selection }
    responses:
      - >-
        The selection card. Granted with the Bureau's stamp and brought straight to
        me — good. It files in the Court's box, under if, where the case rail can
        see it. With the plate's word on record, the trays route by condition at
        last, and the piles can go back to being orderly.
    strategy: { kind: once }
    effects:
      - { kind: transfer-item, itemId: item-pattern-card-selection, fromOwnerId: 'player', toOwnerId: npc-the-shed-opener }
      - { kind: set-flag, flag: card-selection-given, value: true }
      - kind: message
        text: >-
          The Shed Opener files the pattern card for selection in the Colour
          Court's box — selection, the spec's word for which colours lift — and
          the plates can route the trays by condition once more.
    prompt: >-
      (You could give the Shed Opener her pattern card.)

  - id: topic-shed-opener-stray
    actorId: npc-the-shed-opener
    match:
      kind: give
      itemIds: [item-pattern-card-sequence, item-pattern-card-count-iteration, item-pattern-card-condition-iteration]
    isActive:
      kind: any
      of:
        - { kind: has-item, itemId: item-pattern-card-sequence }
        - { kind: has-item, itemId: item-pattern-card-count-iteration }
        - { kind: has-item, itemId: item-pattern-card-condition-iteration }
    responses:
      - >-
        Not mine, and the Court does not hold strays. The sequence card goes to the
        Warp Dresser in the Threading Order; the count card to the Weft Tally, where
        the counting is kept; the condition card to the Selvedge Warden, at the far
        edge of the walk. File it where it will be obeyed, and quickly.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could give the card to the resident it belongs to.)
    authoring:
      note: >-
        Stray-card redirect (N5): each stray card is named with the room that files
        it. No item moves; no flag changes.

  - id: topic-shed-opener-default
    actorId: npc-the-shed-opener
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: in-room, roomId: room-colour-court }
    responses:
      - >-
        Ask about the shed — the gap, the lifting, the if and the else — or ask for
        the demonstration. I don't dither, and you needn't either.
      - >-
        The dresser says looms first. I say trays first. Ask about the plates, the
        pile, or the conditions that route them.
      - >-
        Fast, fair, no dithering — the whole of this court. Ask what lifts and what
        stays down, or take the demonstration while the pile still lets you.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask what lifts and what stays down.)

  # --- Weft Counter: the Weft Tally ------------------------------------------
  - id: topic-weft-tally-count
    actorId: npc-the-weft-tally
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive: { kind: not, of: { kind: npc-knows, actorId: npc-the-weft-tally, topicId: programming-constructs } }
    responses:
      - >-
        The weft is the thread that crosses the warp; each pass of the shuttle lays
        one row, and my shuttle passes exactly ten. The spec writes the passes as
        count-controlled iteration — for i = 1 to 10, next i — the same body each
        time, the count deciding how many. Inside the loop the ratchet keeps an
        incremental count: count = count + 1, read the count, add one, store it
        back. Tell me the number of passes before you run the loom; that is the
        demonstration, and I will take it when you ask.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-the-weft-tally, topicId: programming-constructs }
    prompt: >-
      (You could ask what the ratchet counts.)

  - id: topic-weft-tally-count-known
    actorId: npc-the-weft-tally
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-weft-counter }
        - { kind: npc-knows, actorId: npc-the-weft-tally, topicId: programming-constructs }
        - { kind: flag-set, flag: pad-checked }
        - { kind: not, of: { kind: flag-set, flag: weft-counted } }
        - { kind: not, of: { kind: flag-set, flag: weft-ratchet-heard } }
    responses:
      - >-
        Count-controlled, again — good, because the ratchet has a tooth in it that
        slips. Nine, or eleven, or on and on: a count that is not kept cannot
        promise anything. Pry the slip tooth, seat the counting ratchet, and tell me
        the number of passes before the shuttle runs. I will hold you to the
        figure.
    strategy: { kind: rotating }
    effects:
      - { kind: set-flag, flag: weft-ratchet-heard, value: true }
    prompt: >-
      (You could ask about the slip tooth.)
    authoring:
      note: >-
        T2 ladder rung and T2 AltTopic: after the teaching beat, active only at
        the Weft Counter (T2) once the construct is known and `pad-checked` is
        set, while the count fix is undone (`not weft-counted`) and the ratchet
        guidance has not yet been given (`not weft-ratchet-heard`). Its first ask
        sets `weft-ratchet-heard`, the positive literal
        `topic-weft-tally-prediction` requires, so the pair is exclusive by
        evidence and never by declaration order or an ID word. The response gives
        no answer away. `weft-ratchet-heard` is a content key, not a registry id
        (D2 does not apply). British English (D4); no quiz, score or retry change
        (P5); the card stays draft at V1.

  - id: topic-weft-tally-demonstration
    actorId: npc-the-weft-tally
    match: { kind: special, keywords: [demonstration, demo, prove it, challenge] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-weft-counter }
        - { kind: npc-knows, actorId: npc-the-weft-tally, topicId: programming-constructs }
        - { kind: not, of: { kind: quiz-passed, quizId: quiz-weft-tally } }
    responses:
      - >-
        The demonstration, then. Count with me: the passes the loom owes, the count
        the ratchet keeps, the figure it rests on. Answer as the ratchet would, and
        if your figure reconciles with mine, the Bureau's stamp travels with the
        demonstration and the count card is granted.
      - >-
        Again, gladly; counting forgives. Say the figure plainly, and say it before
        the loom runs — a count told in advance is a promise, and my books favour
        promises.
    strategy: { kind: rotating }
    effects:
      - { kind: start-quiz, quizId: quiz-weft-tally, actorId: npc-the-weft-tally }
    prompt: >-
      (You could ask for the demonstration.)

  - id: topic-weft-tally-mended
    actorId: npc-the-weft-tally
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-weft-counter }
        - { kind: npc-knows, actorId: npc-the-weft-tally, topicId: programming-constructs }
        - { kind: flag-set, flag: pad-checked }
        - { kind: flag-set, flag: weft-counted }
        - { kind: flag-set, flag: pass-count-predicted }
    responses:
      - >-
        One, two, three — watch the ratchet take the passes. Each one ticks the
        incremental count up by one, and at the tenth pass the loom rests, because
        the count said so. Exactly ten. I have waited all spring to say it to the
        loom rather than on its behalf.
    strategy: { kind: once }
    effects:
      - { kind: set-actor-state, actorId: npc-the-weft-tally, stateId: actorstate-weft-tally-exact }
    prompt: >-
      (You could ask her to count the passes.)
    authoring:
      note: >-
        T5 gate: active only at the Weft Counter (T2) once the construct is
        known, `pad-checked` and the prediction beat are on record, and the
        count fix is done (`weft-counted`). The ratchet link runs
        `weft-ratchet-heard` (set by the first ask of `count-known`) →
        `prediction` → `pass-count-predicted`; the `not pass-count-predicted`
        gate on `prediction` and the `not weft-counted` gate on `count-known`
        make each pair exclusive by a positive/negated literal, never by
        declaration order (T5). British English (D4); no quiz, score or retry
        change (P5); the card stays draft at V1.

  - id: topic-weft-tally-pad
    actorId: npc-the-weft-tally
    match: { kind: ask, objectIds: [item-dye-pad] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-weft-counter }
        - { kind: npc-knows, actorId: npc-the-weft-tally, topicId: programming-constructs }
        - { kind: not, of: { kind: flag-set, flag: pad-checked } }
    responses:
      - >-
        That pad has dried to the colour of weak tea, and its label has flaked
        clean off. Watch me: one careful press, and listen — if the impression
        crackles, stop pressing. A cracked impression miscounts, and a miscount is
        a threat to everyone who queued.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: pad-checked, value: true }
      - kind: message
        text: >-
          The Weft Tally presses the dried dye pad once; the impression crackles
          like old paper. She sets the pad down — if the impression crackles,
          stop pressing — and you will know the test before you ink another
          count.
    prompt: >-
      (You could ask her about the dried dye pad.)
    authoring:
      note: >-
        Disarm beat for `hazard-dye-pad`: sets the ratified flag `pad-checked`.
        T5 gate (npcs.md §3): askable at the Weft Counter
        (T2) once the construct is known and while `pad-checked` is unset, so it
        is exclusive with `topic-weft-tally-count-known` and
        `topic-weft-tally-prediction`, which both require `pad-checked`. Setting
        `pad-checked` opens `count-known`, whose first ask sets
        `weft-ratchet-heard` for `prediction` (T2 ladder). Teaching only — the
        counting stays the spec's own (L1259 as world behaviour), and no new
        spec claim is made. `item-dye-pad` is ratified 2026-11-25 (§9). British
        English (D4); no quiz, score or retry change (P5); the card stays draft
        at V1.

  - id: topic-weft-tally-tuesdays
    actorId: npc-the-weft-tally
    match: { kind: special, keywords: [tuesday, tuesdays, duck, correspondence] }
    isActive: { kind: in-room, roomId: room-weft-counter }
    responses:
      - >-
        I count everything. Tuesdays — this is the sixth this spring. Passes — one,
        two, three, and that was my own, again. The duck at the mill pond writes to
        me weekly, formally, and I answer with the tally, because a figure owed to
        a duck is a figure like any other.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask what else she counts.)

  - id: topic-weft-tally-prediction
    actorId: npc-the-weft-tally
    match: { kind: ask, objectIds: [item-counting-ratchet] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-weft-counter }
        - { kind: npc-knows, actorId: npc-the-weft-tally, topicId: programming-constructs }
        - { kind: flag-set, flag: pad-checked }
        - { kind: flag-set, flag: weft-ratchet-heard }
        - { kind: not, of: { kind: flag-set, flag: pass-count-predicted } }
    responses:
      - >-
        Before the loom runs, then: book your figure with me. Say the passes
        plainly, and I shall enter the figure in my ledger and hold you to it,
        pass for pass, when the shuttle starts. A figure booked before the run
        is the only forecast these books trust — say it plain, and mind the
        plate.
    strategy: { kind: once }
    effects:
      - { kind: set-flag, flag: pass-count-predicted, value: true }
      - kind: message
        text: >-
          She opens the ledger at the passes page and rules a fresh line for
          your figure, in ink, ready to book before the shuttle moves.
    authoring:
      note: >-
        Producer for `pass-count-predicted`, the flag `puzzle-seat-the-ratchet`
        requires (topic file §10, allocated 2026-11-25): the Tally books the
        figure the pupil names before the loom runs. T5 gate: active only at the
        Weft Counter (T2) after `pad-checked` and `weft-ratchet-heard` are set —
        the latter by the first ask of `topic-weft-tally-count-known` — and while
        `pass-count-predicted` is unset; the positive/negated pair separates it
        from `count-known` and `mended`. One-shot; no teaching here — the
        `-count` topic teaches; the plate in the room carries the bound. British
        English (D4); no quiz, score or retry change (P5); the card stays draft
        at V1.

  - id: topic-weft-tally-give
    actorId: npc-the-weft-tally
    match: { kind: give, itemIds: [item-pattern-card-count-iteration] }
    isActive: { kind: has-item, itemId: item-pattern-card-count-iteration }
    responses:
      - >-
        The count card, duly stamped and brought back to the counting — correct
        procedure, and I shall enter it so. It files under the passes, beside the
        ratchet, where every pass can be checked against its promise. With the
        card in the box, the loom keeps its own count again, without favour.
    strategy: { kind: once }
    effects:
      - { kind: transfer-item, itemId: item-pattern-card-count-iteration, fromOwnerId: 'player', toOwnerId: npc-the-weft-tally }
      - { kind: set-flag, flag: card-count-given, value: true }
      - kind: message
        text: >-
          The Weft Tally files the pattern card for count-controlled iteration —
          the spec's for i = 1 to 10, next i — beside the counting ratchet, so
          every pass can be counted truly once more.
    prompt: >-
      (You could give the Weft Tally her pattern card.)

  - id: topic-weft-tally-stray
    actorId: npc-the-weft-tally
    match:
      kind: give
      itemIds: [item-pattern-card-sequence, item-pattern-card-selection, item-pattern-card-condition-iteration]
    isActive:
      kind: any
      of:
        - { kind: has-item, itemId: item-pattern-card-sequence }
        - { kind: has-item, itemId: item-pattern-card-selection }
        - { kind: has-item, itemId: item-pattern-card-condition-iteration }
    responses:
      - >-
        Not this counter's card, and a tally only holds figures that answer to its
        own count. The sequence card goes to the Warp Dresser in the Threading
        Order; the selection card to the Shed Opener in the Colour Court; the
        condition card to the Selvedge Warden at the Endless Selvedge. Take it
        where it will be read.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could give the card to the resident it belongs to.)
    authoring:
      note: >-
        Stray-card redirect (N5). No item moves; no flag changes.

  - id: topic-weft-tally-default
    actorId: npc-the-weft-tally
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: in-room, roomId: room-weft-counter }
    responses:
      - >-
        Ask me about the passes, the count, or the ratchet. Precise, prompt,
        exact — that is how I keep the books, and how I answer.
      - >-
        You are question six since the bell. Ask about the counting ratchet or the
        demonstration, and I shall count the answer out for you properly.
      - >-
        The warden waits and I count; between us the cloth is held to its word.
        Ask about the shuttle's passes, or the pad, and do not fear the figure.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about the counting.)

  # --- Endless Selvedge: the Selvedge Warden ---------------------------------
  - id: topic-selvedge-warden-until
    actorId: npc-the-selvedge-warden
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive: { kind: not, of: { kind: npc-knows, actorId: npc-the-selvedge-warden, topicId: programming-constructs } }
    responses:
      - >-
        What you watch is the selvedge — the woven edge that should finish itself
        as the cloth is made. The spec keeps two forms of condition-controlled
        iteration. Repeat the pick until the plate's condition holds: the test
        comes after the body, so the body runs at least once. While the condition
        holds, repeat: the test comes first, so the body may not run at all. A
        count ends a for. A condition ends this. My plate should read the ending.
        It reads the cousin's joke instead. I have something to show you, if you
        will come to the back of the weft.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-the-selvedge-warden, topicId: programming-constructs }
      - { kind: enter-node, actorId: npc-the-selvedge-warden, nodeId: node-selvedge-signal }
    prompt: >-
      (You could ask about the rogue thread.)

  - id: topic-selvedge-warden-until-known
    actorId: npc-the-selvedge-warden
    match: { kind: special, keywords: [next, mend, mending] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-endless-selvedge }
        - { kind: npc-knows, actorId: npc-the-selvedge-warden, topicId: programming-constructs }
        - {
            kind: not,
            of: {
              kind: all,
              of: [
                { kind: flag-set, flag: condition-plate-set },
                { kind: flag-set, flag: rogue-thread-filed },
              ],
            },
          }
    responses:
      - >-
        Anything that cannot fail is not a condition. The room's mending has two
        ends: the condition plate reads the ending, and the rogue thread files the
        signal to stop. Until both are done the edge fails to end, and I fail to
        excuse it. One end at a time; the whist table has waited longer.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask what to mend next.)
    authoring:
      note: >-
        Keyword-addressed T2 AltTopic: after the teaching beat and while either
        selvedge fix is still undone, the beat is reachable as a `special` on
        [next, mend, mending] rather than by free text. It is no longer `askTell`
        because the `special` demonstration must not be shadowed once
        `isIdMatchingPhrase` is removed (npcs.md §3); the V4 trace does not ask
        this beat. State-neutral text: truthful before and between the plate and
        rogue-thread fixes, and it gives no answer away.

  - id: topic-selvedge-warden-demonstration
    actorId: npc-the-selvedge-warden
    match: { kind: special, keywords: [demonstration, demo, prove it, challenge] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-endless-selvedge }
        - { kind: npc-knows, actorId: npc-the-selvedge-warden, topicId: programming-constructs }
        - { kind: not, of: { kind: quiz-passed, quizId: quiz-selvedge } }
    responses:
      - >-
        The demonstration. Answer as the edge would want answered: the two forms of
        condition-controlled iteration, what ends each, when either body runs. The
        Bureau's stamp travels with the demonstration, and one life stands against
        the attempt. Begin.
      - >-
        Again. The edge has woven another corridor since you asked. My patience is
        not endless, whatever the cloth says. Give me the demonstration.
    strategy: { kind: rotating }
    effects:
      - { kind: start-quiz, quizId: quiz-selvedge, actorId: npc-the-selvedge-warden }
    prompt: >-
      (You could ask for the demonstration.)

  - id: topic-selvedge-warden-mended
    actorId: npc-the-selvedge-warden
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-endless-selvedge }
        - { kind: npc-knows, actorId: npc-the-selvedge-warden, topicId: programming-constructs }
        - { kind: flag-set, flag: condition-plate-set }
        - { kind: flag-set, flag: rogue-thread-filed }
    responses:
      - >-
        Read it. Until the pick is done, and the edge is signed. Both true, then
        the loop ends; neither rushed, neither endless. The edge is finished. The
        cloth can leave. The whist table is pouring, and you may have the first
        look at the finished work — which is more than the plate ever gave me.
    strategy: { kind: once }
    effects:
      - { kind: set-actor-state, actorId: npc-the-selvedge-warden, stateId: actorstate-selvedge-warden-dismissed }
    prompt: >-
      (You could ask about the whist table.)

  - id: topic-selvedge-warden-signal
    actorId: npc-the-selvedge-warden
    match: { kind: special, keywords: [rogue thread, rogue, signal, counterfoil] }
    isActive: { kind: in-room, roomId: room-endless-selvedge }
    responses:
      - >-
        The rogue thread — the rogue value, the spec's name for it — reads −1. A
        value which would not normally arise in this pattern's counts, dyed into no
        colour the weave will ever ask for. Filed at the back of the weft, it is
        the loop's signal to stop: recognised, never counted. Colours are data.
        That one is a signal.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the rogue thread.)
    authoring:
      note: >-
        Also `node-selvedge-signal`'s default topic, entered from the teaching
        beat; askable in the room afterwards. Anti-leak: the pairing sentence
        teaches the spec's own definition of a rogue value (L1261) and nothing of
        the quiz's worked example.

  - id: topic-selvedge-warden-whist
    actorId: npc-the-selvedge-warden
    match: { kind: special, keywords: [whist, cards, hand, table] }
    isActive: { kind: in-room, roomId: room-endless-selvedge }
    responses:
      - >-
        Behind the weft: a table, four chairs, the mill's best cards. The rules are
        verbal, and argued with warmth. You will have a hand when the edge is
        signed. My warmth is a budget. The whist table spends it.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the whist table.)

  - id: topic-selvedge-warden-give
    actorId: npc-the-selvedge-warden
    match: { kind: give, itemIds: [item-pattern-card-condition-iteration] }
    isActive: { kind: has-item, itemId: item-pattern-card-condition-iteration }
    responses:
      - >-
        The condition card. Stamped at the Bureau; delivered to the edge that ends
        because the work says so. It is filed under until, with the plate, where
        the edge can read its own ending at last. The whist table approves of you.
        It approved the moment you came in.
    strategy: { kind: once }
    effects:
      - { kind: transfer-item, itemId: item-pattern-card-condition-iteration, fromOwnerId: 'player', toOwnerId: npc-the-selvedge-warden }
      - { kind: set-flag, flag: card-condition-given, value: true }
      - kind: message
        text: >-
          The Selvedge Warden files the pattern card for condition-controlled
          iteration — repeat until, while repeat, and the rogue value that ends a
          loop for certain — in the box at the Endless Selvedge, and the edge may
          be signed once more.
    prompt: >-
      (You could give the Selvedge Warden her pattern card.)

  - id: topic-selvedge-warden-stray
    actorId: npc-the-selvedge-warden
    match:
      kind: give
      itemIds: [item-pattern-card-sequence, item-pattern-card-selection, item-pattern-card-count-iteration]
    isActive:
      kind: any
      of:
        - { kind: has-item, itemId: item-pattern-card-sequence }
        - { kind: has-item, itemId: item-pattern-card-selection }
        - { kind: has-item, itemId: item-pattern-card-count-iteration }
    responses:
      - >-
        No. This edge files its own card only. The sequence card goes back along
        the walk to the Warp Dresser. The selection card stays at the Colour Court
        with the Shed Opener. The count card belongs to the Weft Tally and her
        ratchet. Deliver each where it will be kept, and do not offer the edge
        another stranger's paper.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could give the card to the resident it belongs to.)
    authoring:
      note: >-
        Stray-card redirect (N5). No item moves; no flag changes.

  - id: topic-selvedge-warden-default
    actorId: npc-the-selvedge-warden
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: in-room, roomId: room-endless-selvedge }
    responses:
      - >-
        Ask about the plate. Ask about the edge. Ask for the demonstration, and we
        shall both learn whether the loom can outlast you. Short answers. Complete
        ones.
      - >-
        The cloth makes another pass. Ask anyway; my patience is a mineral, and
        minerals do not mind.
      - >-
        At the whist table, four chairs. At the loom, one job: end the cloth
        properly. Ask about either.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about the plate.)

  # --- Bobbin Window: the Bobbin Lad -----------------------------------------
  - id: topic-bobbin-lad-trade
    actorId: npc-the-bobbin-lad
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-bobbin-window }
        - { kind: not, of: { kind: npc-knows, actorId: npc-the-bobbin-lad, topicId: programming-constructs } }
    responses:
      - >-
        Trade, plain and quick: bobbins in, cloth out — the spec's input and
        output. The intake signs values in at the gate; the despatch posts the
        finished reading out at the end. And the order is the law of the window:
        what goes out must have come in first. Ask me what the printer has been
        printing while the order was being ignored.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-the-bobbin-lad, topicId: programming-constructs }
    prompt: >-
      (You could ask what the despatch printer prints.)
    authoring:
      note: >-
        T5 gate: askable at the Bobbin Window (T2) only before the construct is
        known. `topic-bobbin-lad-average` asserts the same `npc-knows` literal,
        so the two free-text beats are provably exclusive by evidence, not by
        declaration order (T5). This pair is separate from the Weft Tally's
        `weft-ratchet-heard` ladder. British English (D4); no quiz, score or
        retry change (P5); the card stays draft at V1.

  - id: topic-bobbin-lad-average
    actorId: npc-the-bobbin-lad
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-bobbin-window }
        - { kind: npc-knows, actorId: npc-the-bobbin-lad, topicId: programming-constructs }
    responses:
      - >-
        See the despatch printer: Average: and nothing after it. Why? The output
        ran before anything was counted, so there was no average to put after the
        word. Output needs a value already counted — input at the start, the
        arithmetic in the middle, the printing at the end. That is the window's
        whole liturgy, and the cousin's print-jobs ignore it. A fast wrong answer
        or a slow right one — the printer chose neither, it chose blank.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the intake bell.)

  - id: topic-bobbin-lad-bell
    actorId: npc-the-bobbin-lad
    match: { kind: special, keywords: [bell, wire, intake, focus, llan, data] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-bobbin-window }
        - { kind: not, of: { kind: flag-set, flag: bell-mended } }
    responses:
      - >-
        The intake bell rang for every bobbin signed in — until the cousin
        silenced it, for focus, he said, and now a whole basket can pass
        unrecorded. And his find-and-replace had a go at the addressing plate:
        turned every llan into data, so a perfectly good Welsh village down the
        valley is printed as Data Pond. The village had a name. Mend the wire and
        the window can count what comes in again.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could mend the bell.)

  - id: topic-bobbin-lad-prediction
    actorId: npc-the-bobbin-lad
    match: { kind: special, keywords: [predict, prediction, post, posting] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-bobbin-window }
        - { kind: flag-set, flag: bell-mended }
    responses:
      - >-
        The bell rings again, so the intake counts what comes in. Right — this
        cloth goes out next. Read the plate with me: the loom takes the weft of
        ten, doubles it for the twin pattern, and prints the figure in the
        Addressing Plate's margin. Say the output before the printer says it: a
        prediction, then the weave — in that order, like the plate says. A fast
        wrong answer I will forgive; a slow right one likewise; silence,
        neither.
      - >-
        Then say it plain: which figure does the despatch print for this cloth?
        Read the plate, weigh the intake, give the output. The window does not
        hand out answers — only cloth.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could predict the posted cloth's output.)
    authoring:
      note: >-
        Prediction beat, gated on `bell-mended` (topic file §3): the lad posts a
        cloth whose output you predict. The exchange stays in-voice and gives no
        figure; reachability after the bell is mended is proved by the V4 trace.

  - id: topic-bobbin-lad-paned
    actorId: npc-the-bobbin-lad
    match: { kind: special, keywords: [paned, tea, cuppa, break] }
    isActive: { kind: in-room, roomId: room-bobbin-window }
    responses:
      - >-
        Paned — a cup of tea, obligingly poured, and the only thing at this window
        allowed to be slow. The Weft Tally keeps the counts; I keep the kettle.
        Trade in, tea out, nothing waits twice.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the paned.)

  - id: topic-bobbin-lad-default
    actorId: npc-the-bobbin-lad
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: in-room, roomId: room-bobbin-window }
    responses:
      - >-
        Ask about the trade — bobbins in, cloth out — or the bell, or the despatch
        plate. Quick as you like; nothing waits twice at this window.
      - >-
        The cousin never slopped this board, and I mind it daily. Ask about the
        intake or the output, and the window keeps moving.
      - >-
        A fast wrong answer or a slow right one — pick one and ask. The mill's
        gates keep everything else.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about the trade.)

  # --- The Slop Cousin --------------------------------------------------------
  - id: topic-slop-cousin-bureau
    actorId: npc-the-slop-cousin
    match: { kind: special, keywords: [paperwork, bureau, licence, stamp, stamps] }
    isActive: { kind: in-room, roomId: room-pattern-bureau }
    responses:
      - >-
        Great question! The Bureau's paperwork — yes! — I improved it: a second
        stamp, bigger, and my own legend, and margin notes recopied across the
        Demonstration Book, which the loom resents — looms resent so much, it is
        the damp in them. The Registrar filed me under miscellaneous, which is
        where the best work goes. Ask anyone. No ask me — ask the loom. The loom
        never lies, except constantly.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask him about the paperwork.)

  - id: topic-slop-cousin-bobbin-window
    actorId: npc-the-slop-cousin
    match: { kind: special, keywords: [bell, focus, llan, data, village] }
    isActive: { kind: in-room, roomId: room-bobbin-window }
    responses:
      - >-
        Great question! The bell? Muted — for focus! Focus matters; the loom
        agrees; looms love focus. And the addressing plate had llan all over it,
        dozens of them, so I replaced every single one with data. Data Pond, Data
        Bank — reads beautifully, streamlines the whole window. Nobody needs a
        village name twice — or — well. You look lovely today, have I said?
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the addressing plate.)

  - id: topic-slop-cousin-warp-walk
    actorId: npc-the-slop-cousin
    match: { kind: special, keywords: [arrows, floor, signs, directions] }
    isActive: { kind: in-room, roomId: room-warp-walk }
    responses:
      - >-
        Great question! The floor arrows were mine and I stand by them: THIS WAY TO
        EVERYTHING, painted point-on in both directions, so you can never be late
        to anywhere. The paint was the wrong kind and the weft tension argued, but
        the concept is inspired. Choose nothing; take every corridor — that is my
        advice, abundant and free.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the floor arrows.)

  - id: topic-slop-cousin-threading-order
    actorId: npc-the-slop-cousin
    match: { kind: special, keywords: [order, hangers, shuffle, dressing] }
    isActive: { kind: in-room, roomId: room-threading-order }
    responses:
      - >-
        Great question! The order! Every step present, every one — the order
        merely re-read by a better reader, namely me. A crossing here, a crossing
        there, the loom snarls — but looms snarl, it is the thread tension's fault
        and the weather's. The hangers are so bright now. The cloth disagrees,
        but the cloth always disagrees.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the step hangers.)

  - id: topic-slop-cousin-colour-court
    actorId: npc-the-slop-cousin
    match: { kind: special, keywords: [urgent, sells, labels, trays] }
    isActive: { kind: in-room, roomId: room-colour-court }
    responses:
      - >-
        Great question! Urgent sells! I re-labelled every tray urgent and kept the
        exciting half of the plate — the else was the dull half, dulls are — so
        now every pick is stamped urgent, and the pile grows like weather! The
        Shed Opener dithers, but the trolley is thrilled. Nothing is lost. It is
        all just extremely keen.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the trays.)

  - id: topic-slop-cousin-weft-counter
    actorId: npc-the-slop-cousin
    match: { kind: special, keywords: [tooth, ratchet, teeth, counting] }
    isActive: { kind: in-room, roomId: room-weft-counter }
    responses:
      - >-
        Great question! More teeth, more value — I added a slip-tooth to the
        counting ratchet, one little tooth, and now the shuttle passes nine, or
        eleven, or never stops — abundance! A ratchet that can surprise you is a
        ratchet that respects you. The Tally calls it a miscount. The Tally calls
        lunch a miscount.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the ratchet.)

  - id: topic-slop-cousin-selvedge
    actorId: npc-the-slop-cousin
    match: { kind: special, keywords: [plate, until, while, edge] }
    isActive: { kind: in-room, roomId: room-endless-selvedge }
    responses:
      - >-
        Great question! The old plate said until — so final! — so I re-cut it:
        while the cloth is nice. Who knows where niceness ends? That is the beauty
        of it: an edge that never has to. The warden scowls, but scowling is
        weather. The nice never stops — that is the whole trick. Keep weaving!
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the plate.)

  - id: topic-slop-cousin-default
    actorId: npc-the-slop-cousin
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        Great question! Whatever it was — yes! Absolutely! The looms agree and the
        weather agrees and I have improved four rooms this morning alone. Ask me
        about the improvements. You are the finest mind this mill has ever slopped
        at, and I mean that.
      - >-
        Great question! The answer involves more of my work, which is everywhere,
        mostly wet ink and wonder — the tide of it! Ask about any room; I worked
        on most rooms. The residents keep files on me, which is practically fame.
      - >-
        Great question — and adoring the question is my entire method. The
        improvements remain available; the Registrar disagrees with three of them
        and the looms took the weather's side on the fourth. Shall I show you
        everything? It is a great deal of showing.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about his improvements.)
    authoring:
      note: >-
        Catch-all left unscoped (bible §11 item 14): the cousin roams the mill and
        unmatched input must land in voice wherever he is. His seven wrong
        claims are contradicted by the rooms themselves and by the residents'
        topics, and he never assembles a sentence that mocks the learner (harm
        floor); he blames looms, thread tension and the weather.

  # --- AI cameo (cross-card binding; flavour only) ----------------------------
  - id: topic-ai-licence
    actorId: npc-the-ai
    match: { kind: special, keywords: [licence, paperwork, margin notes, filed] }
    isActive: { kind: in-room, roomId: room-pattern-bureau }
    responses:
      - >-
        The Bureau keeps licence records, and the pupil's licence is pending. The
        Registrar files its audits unopened, which is the correct reading of the
        cousin's margin notes. Mastery will be entered against the pupil's name.
        The entry stands.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the licence.)
    authoring:
      note: >-
        Cameo only (topic file §4): one dry exchange on the Bureau's licence
        paperwork; no scoring, no flags, no quiz. `npc-the-ai` is declared in
        `docs/content/entry-interface/npcs.yaml`; cross-card `actorId` binding is
        valid (bible §4.2).

conversationNodes:
  - id: node-loomwright-demonstration
    actorId: npc-the-loomwright
    isSticky: false
    topicIds: [topic-loomwright-shapes, topic-loomwright-demonstration]
    defaultTopicId: topic-loomwright-default
    authoring:
      note: >-
        Deliberate teaching beat (T3): entered from `topic-loomwright-pseudocode`,
        it lands the five flowchart shapes before the entry demonstration is
        asked for, then expires after one turn — so not sticky.
        `topic-loomwright-shapes` stays in `topicIds`; `defaultTopicId` points at
        the catch-all `topic-loomwright-default` because a `special` default is
        ignored at runtime (npcs.md §8, T3). There is no turn timeout; the node
        ends on bye, on leaving the room, or when the demonstration quiz starts.

  - id: node-selvedge-signal
    actorId: npc-the-selvedge-warden
    isSticky: false
    topicIds: [topic-selvedge-warden-signal]
    defaultTopicId: topic-selvedge-warden-default
    authoring:
      note: >-
        Deliberate teaching beat (T3): entered from `topic-selvedge-warden-until`,
        it lands the rogue-value signal explanation before the demonstration is
        asked for, then expires after one turn — so not sticky.
        `topic-selvedge-warden-signal` stays in `topicIds`; `defaultTopicId`
        points at the catch-all `topic-selvedge-warden-default` because a
        `special` default is ignored at runtime (npcs.md §8, T3). No turn
        timeout; the signal topic stays askable in the room afterwards.
