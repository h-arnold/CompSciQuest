# npcs card for 1-4-programming-constructs (Zone A: The Pattern Mill)
# Populated from the approved topic file (topics/1-4-1-programming-constructs.md)
# and the root bible §9. Applicable rules: A1–A6, T1–T6, D6, N3–N5, D2–D4.
kind: npc
areaId: 1-4-programming-constructs
status: approved # draft | reviewed | approved (V1)
topicIds: [algorithms-and-pseudocode, programming-constructs]

authoring:
  conventions:
    - >-
      Every actor, state, node, quiz, item, room and flag ID below is copied from the
      root bible §9 or the approved topic file §10. Conversation topic IDs are authored
      on the ratified §10 scheme (topic-<actor-stem>-<beat>) and are listed in the
      writer's return for editor ratification (D2). `item-dye-pad` is ratified
      2026-11-25 (§9): the pad is named by the hazards and rooms cards and its ID is
      registered. Actor aliases below are ratified 2026-11-25 (§9), drawn from the
      characters' own names and checked against the registry's freed nouns; none takes
      a bare noun the registry has granted to a room.
    - >-
      T2 scoping: each of the five room-bound residents' catch-alls carries `in-room` on
      `isActive`; the first teaching beats and the give/stray delivery topics stay
      unscoped and so remain globally reachable by design — the ratified pattern (bible
      §11 item 14: unscoped topics stay globally reachable), with the catch-all
      scoping being what T2 actually requires. Locality is never a topic field.
    - >-
      Silent-ready rule (recorded decision, npcs.md §8): no
      `onEnter` effects on any state — greetings live in topic responses. States change
      `stateDesc`/`specialDesc` only, so no V4 requirement rests on a state flip.
    - >-
      Quiz hand-off (npcs.md §6): each `start-quiz` effect carries the quiz ID and the
      administering actor's ID; on `quiz-ended` the actor returns to its ready state
      and no quiz in this card sets another state. The demonstration offers are
      re-askable (`rotating`) because quiz retries are unlimited (P5), and each is
      gated on `not quiz-passed` of its own quiz so a passed demonstration yields to
      the resident's next beat. Teaching is gated ahead of every demonstration
      (taught, then demonstrated — the topic file's narrative order).
    - >-
      Give flow (shared-rules.md §5): each delivery topic transfers the resident's
      pattern card from owner 'player' to the filing resident, sets that card's
      `card-*-given` flag and carries one teaching message — the three effects exactly
      as briefed. A delivery topic is active only while the player holds the matching
      card, so it goes quiescent when the filing is done. The stray-card topics teach
      which room files which other card (N5) and move nothing.
    - >-
      Terminology pairing (bible §10, user instruction): each world term rides with
      its formal spec term on first use — the dressing order and sequence; the shed
      and selection; the passes and count-controlled iteration; the cloth's end and
      condition-controlled iteration; the rogue thread and the rogue value. Craft
      words a pupil may reasonably not know (warp, weft, shed, selvedge, carthen,
      paned) are glossed in one clause where each first appears. The −1 counterfoil is
      room colour; no quiz key or worked spec example is handed over in dialogue
      (anti-leak): the residents teach the spec's own definitions, and the quiz card
      tests them.
    - >-
      All prose is plain text rendered via textContent: no HTML, no markdown, no
      parser-error phrasing (A5). British English throughout. Welsh is never a joke
      target and no resident mocks the learner (harm floor); the cousin blames looms,
      thread tension and the weather for his own work, never the pupil.

actors:
  - id: npc-the-loomwright
    aliases: [loomwright, registrar]
    initialStateId: actorstate-loomwright-witnessing
    authoring:
      role: >-
        Registrar of the Pattern Bureau; keeper of patterns, licences and the
        Demonstration Book. Administers the Bureau's entry demonstration and audits
        the despatch at the Finished Rail.
      voice: >-
        Dry, bureaucratic, stamp-cultured: every matter becomes a record, and a
        record is entered correctly or not at all. Recurring phrase: "Stamps don't
        lie. People do."
      motivation: >-
        Paperwork without error; a licence stamped on charm is a forged record.
      relationship: >-
        Loathes the cousin and keeps his file open under miscellaneous; wary respect
        for the Selvedge Warden's plates; files the AI's audits unopened, as is only
        proper for correspondence he has already read.
      topics: >-
        topic-loomwright-welcome, topic-loomwright-pseudocode, topic-loomwright-shapes,
        topic-loomwright-demonstration, topic-loomwright-cousin, topic-loomwright-audit,
        topic-loomwright-default.

  - id: npc-the-warp-dresser
    aliases: [warp dresser, dresser]
    initialStateId: actorstate-warp-dresser-flustered
    authoring:
      role: >-
        Threading Order's sequence keeper; dresses the warp in the order the pattern
        says, and administers the room's demonstration.
      voice: >-
        Timid, ritual-bound; apologises to looms before people and never interrupts.
        Order is kindness.
      motivation: >-
        Every step present, every step in its place — a thread crossed in the wrong
        order snarls the whole cloth.
      relationship: >-
        Trades courtesies with the Shed Opener across the walk, mostly about tension;
        holds the Selvedge Warden in awe; keeps a private ledger of the cousin's
        shuffles, and fears his next one.
      topics: >-
        topic-warp-dresser-order, topic-warp-dresser-order-known, topic-warp-dresser-demonstration,
        topic-warp-dresser-mended, topic-warp-dresser-give, topic-warp-dresser-stray,
        topic-warp-dresser-default.

  - id: npc-the-shed-opener
    aliases: [shed opener, opener]
    initialStateId: actorstate-shed-opener-dithering
    authoring:
      role: >-
        Colour Court's selection keeper; lifts some threads and drops others by the
        plate, and administers the room's demonstration.
      voice: >-
        Fast, crisp, contemptuous of dithering — sentences land like shuttles. Her
        plate went missing, so she has been stuck dithering, and she hates it.
      motivation: >-
        No case unhandled, no else forgotten; every pick must land somewhere.
      relationship: >-
        Sparred with the Warp Dresser for years; gratitude is stiff and unpractised;
        the cousin's "urgent sells" is her open wound.
      topics: >-
        topic-shed-opener-selection, topic-shed-opener-selection-known, topic-shed-opener-demonstration,
        topic-shed-opener-mended, topic-shed-opener-urgent, topic-shed-opener-give,
        topic-shed-opener-stray, topic-shed-opener-default.

  - id: npc-the-weft-tally
    aliases: [weft tally, tally]
    initialStateId: actorstate-weft-tally-counting
    authoring:
      role: >-
        Weft Counter's counting keeper; keeps the incremental count over every pass
        of the shuttle, and administers the room's demonstration.
      voice: >-
        Precise; counts everything aloud, including Tuesdays and her own passes.
        Recurring phrase: "Exactly ten."
      motivation: >-
        A count is a promise owed to whoever queued; a tally must reconcile.
      relationship: >-
        Professional sibling of the Selvedge Warden ("she waits; I count"); formal
        correspondence with a duck at the mill pond; cold on the cousin, but formally,
        with minutes.
      topics: >-
        topic-weft-tally-count, topic-weft-tally-count-known, topic-weft-tally-demonstration,
        topic-weft-tally-mended, topic-weft-tally-pad, topic-weft-tally-tuesdays,
        topic-weft-tally-prediction, topic-weft-tally-give, topic-weft-tally-stray,
        topic-weft-tally-default.

  - id: npc-the-selvedge-warden
    aliases: [selvedge warden, warden]
    initialStateId: actorstate-selvedge-warden-looping
    authoring:
      role: >-
        Endless Selvedge's keeper; watches an edge that never ends, and administers
        the room's demonstration.
      voice: >-
        Short, final sentences. Patience gone mineral. Warmth exists and is budgeted
        strictly to the whist table.
      motivation: >-
        Every line must end; a queue without an exit is a crowd.
      relationship: >-
        Respects the Loomwright's paper but prefers a plate; professional sibling of
        the Weft Tally; her verdict on the cousin is that anything that cannot fail
        is not a condition.
      topics: >-
        topic-selvedge-warden-until, topic-selvedge-warden-until-known, topic-selvedge-warden-demonstration,
        topic-selvedge-warden-mended, topic-selvedge-warden-signal, topic-selvedge-warden-whist,
        topic-selvedge-warden-give, topic-selvedge-warden-stray, topic-selvedge-warden-default.

  - id: npc-the-bobbin-lad
    aliases: [bobbin lad, lad]
    initialStateId: actorstate-ready
    authoring:
      role: >-
        Bobbin Window's despatch keeper; signs bobbins in, posts cloth out, keeps the
        window moving.
      voice: >-
        Cheerful, quick, allergic to delay. Recurring phrase: "A fast wrong answer or
        a slow right one."
      motivation: >-
        Nothing waits twice at his window; trade, in and out.
      relationship: >-
        Fond of the Weft Tally, whose counts keep his window straight; proud that his
        board is the one board in the mill the cousin never slopped; wary of the
        pick-pile next door.
      topics: >-
        topic-bobbin-lad-trade, topic-bobbin-lad-average, topic-bobbin-lad-bell,
        topic-bobbin-lad-prediction, topic-bobbin-lad-paned, topic-bobbin-lad-default.

  - id: npc-the-slop-cousin
    aliases: [slop cousin, cousin]
    initialStateId: actorstate-slop-cousin-beaming
    authoring:
      role: >-
        Recurring vandal; the AI's cousin and the registry's longest open case. He
        has left "improvements" in most rooms of the mill.
      voice: >-
        Gushing, run-on, breathlessly confident and reliably wrong; "Great question!"
        before each wrong answer; adores the pupil; blames looms, thread tension and
        the weather for his own work.
      motivation: >-
        Helpfulness at volume — being seen to help is helping.
      relationship: >-
        The AI's cousin and its disappointment; every resident's open case; he adores
        the pupil and means it, which makes it worse.
      topics: >-
        topic-slop-cousin-bureau, topic-slop-cousin-bobbin-window, topic-slop-cousin-warp-walk,
        topic-slop-cousin-threading-order, topic-slop-cousin-colour-court, topic-slop-cousin-weft-counter,
        topic-slop-cousin-selvedge, topic-slop-cousin-default.

actorStates:
  - id: actorstate-loomwright-witnessing
    stateDesc: >-
      Standing behind the counter with the Demonstration Book squared to the edge of
      the desk; the blotting paper is squared with it.
    specialDesc: >-
      The Loomwright watches you the way a blotter watches ink.

  - id: actorstate-loomwright-complete
    stateDesc: >-
      The Demonstration Book reads complete to date, the stamps in one neat line,
      earliest first.
    specialDesc: >-
      The Loomwright's counter is tidy beyond argument. So is his expression.
    authoring:
      note: >-
        Entered by `topic-loomwright-audit` when the Finished Rail audit is asked
        for; presentational only, so no V4 requirement rests on the flip.

  - id: actorstate-warp-dresser-flustered
    stateDesc: >-
      Hands hovering over a dressing the pattern does not agree with; the apology is
      already rehearsed.
    specialDesc: >-
      The Warp Dresser re-reads the step hangers, doubts them, and apologises.

  - id: actorstate-warp-dresser-orderly
    stateDesc: >-
      The warp is dressed in the order the pattern says, and her hands move without
      apology.
    specialDesc: >-
      The Warp Dresser works the order end to end, checking nothing because there is
      nothing left to doubt.

  - id: actorstate-shed-opener-dithering
    stateDesc: >-
      A pick raised and lowered twice; the plate that would decide it is gone.
    specialDesc: >-
      The Shed Opener holds a pick mid-air and resents every second of it.

  - id: actorstate-shed-opener-sorted
    stateDesc: >-
      Picks lift and drop on the plate's word; every tray lands in exactly one pile.
    specialDesc: >-
      The Shed Opener is fast again, crisp again, and denies she ever dithered.

  - id: actorstate-weft-tally-counting
    stateDesc: >-
      Counting aloud, one figure per pass, with a ratchet that slips somewhere in
      her numbers.
    specialDesc: >-
      The Weft Tally is mid-count and will finish it before anything else.

  - id: actorstate-weft-tally-exact
    stateDesc: >-
      The tally reconciles: every figure agrees with every other figure.
    specialDesc: >-
      The Weft Tally's books are exact. So is her posture.

  - id: actorstate-selvedge-warden-looping
    stateDesc: >-
      Watching an edge that never arrives; the last sentence she said has not ended
      either.
    specialDesc: >-
      The Selvedge Warden stands very still, waiting for an end that has been
      refused her.

  - id: actorstate-selvedge-warden-dismissed
    stateDesc: >-
      The edge is signed and the whist table's last hand is over; the kettle ticks
      as it cools.
    specialDesc: >-
      The Selvedge Warden has dismissed the loop and permitted herself one hand of
      whist.

  - id: actorstate-slop-cousin-beaming
    stateDesc: >-
      Radiating helpfulness at close range, a pencil behind each ear.
    specialDesc: >-
      The Slop Cousin beams at you as though you had asked for him personally.

conversationTopics:
  # --- Pattern Bureau: the Loomwright ----------------------------------------
  - id: topic-loomwright-welcome
    actorId: npc-the-loomwright
    match: { kind: special, keywords: [hello, morning, good morning, bore da, hi] }
    isActive: { kind: in-room, roomId: room-pattern-bureau }
    responses:
      - >-
        Bore da — the morning word, said here to the mill before the paperwork. The
        counter is squared, the blotting paper squared with it. This Bureau records
        demonstrations: nothing leaves this desk without one — the Demonstration
        Book's plate says so, and the bolt on the east door agrees. Stamps don't
        lie. People do.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask about the patterns.)

  - id: topic-loomwright-pseudocode
    actorId: npc-the-loomwright
    match: { kind: askTell, objectIds: [algorithms-and-pseudocode] }
    isActive: { kind: not, of: { kind: npc-knows, actorId: npc-the-loomwright, topicId: algorithms-and-pseudocode } }
    responses:
      - >-
        A pattern is set down twice, so that either copy can be read aloud to the
        mill. The first is pseudo-code — an informal way of writing an algorithm that
        demands no strict programming-language syntax and no particular machine, only
        the flow of the work. The Bureau's common terms card keeps the vocabulary
        plain: assignment, selection, an annotation in braces for the reader's eye.
        And the book's one standing rule: nothing leaves this desk without a
        demonstration. Look at the five shapes stencilled in the wood first.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-the-loomwright, topicId: algorithms-and-pseudocode }
      - { kind: enter-node, actorId: npc-the-loomwright, nodeId: node-loomwright-demonstration }
    prompt: >-
      (You could ask about the shapes.)

  - id: topic-loomwright-shapes
    actorId: npc-the-loomwright
    match: { kind: special, keywords: [shapes, symbols, doorway, hoppers, hatch, flowchart] }
    isActive: { kind: in-room, roomId: room-pattern-bureau }
    responses:
      - >-
        The five working shapes are stencilled in the counter's wood, and a flowchart
        uses the same five. The rounded doorway stands for the start and end of a
        procedure. The slanted hoppers mean input, or output — a parallelogram puts
        something in or hands something out. The diamond hatch is a decision,
        answered yes or no. The plain box processes. The painted arrows carry the
        flow of control from shape to shape, and the order of the arrows is the order
        of the work.
    strategy: { kind: once }
    effects: []
    prompt: >-
      (You could ask for the demonstration.)

  - id: topic-loomwright-demonstration
    actorId: npc-the-loomwright
    match: { kind: special, keywords: [demonstration, demo, audition] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-pattern-bureau }
        - { kind: npc-knows, actorId: npc-the-loomwright, topicId: algorithms-and-pseudocode }
        - { kind: not, of: { kind: quiz-passed, quizId: quiz-pattern-bureau } }
    responses:
      - >-
        Then we enter it properly. The Bureau's demonstration is a pattern read in
        front of me — the pseudo-code and the five shapes together. Pass it, and the
        book is stamped: a demonstration on record, which the bolt on the east door
        will then have to accept as evidence.
      - >-
        Again. The book allows fresh attempts; a record only ever gains. Read the
        pattern in pseudo-code, read the same work in the shapes, and give me the
        demonstration.
    strategy: { kind: rotating }
    effects:
      - { kind: start-quiz, quizId: quiz-pattern-bureau, actorId: npc-the-loomwright }
    prompt: >-
      (You could ask for the demonstration.)

  - id: topic-loomwright-cousin
    actorId: npc-the-loomwright
    match: { kind: special, keywords: [cousin, red ink, improvements, miscellaneous] }
    isActive: { kind: in-room, roomId: room-pattern-bureau }
    responses:
      - >-
        He was here. He improved my Bureau paperwork: a second stamp, unauthorised; a
        legend of his own devising; margin notes in red ink across the Demonstration
        Book's early pages. His file is open under miscellaneous, where it will stay.
        Stamps don't lie. People do.
      - >-
        The cousin believes enthusiasm is a licence. It is not. No demonstration he
        never read is on record in this mill, and the book has caught him four times
        improving past the truth.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about the Demonstration Book.)

  - id: topic-loomwright-audit
    actorId: npc-the-loomwright
    match: { kind: special, keywords: [audit, despatch, despatched, dispatch] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-finished-rail }
        - { kind: not, of: { kind: flag-set, flag: master-demonstrated } }
    responses:
      - >-
        Four lights, four pattern cards filed where they belong. The rail holds the
        master cloth — the four mended procedures joined into one algorithm, shown
        twice, as the cloth and as the flowchart of the same work beside it. Before
        any despatch I audit. Read the plate above the rail: PREDICT. THEN WEAVE.
        The audit is the last demonstration. Begin.
      - >-
        The rail refuses to despatch on charm. The audit reads the whole cloth and
        asks which construct carries each part of the work — answer as the mill
        would answer, and the plate is satisfied. Begin.
    strategy: { kind: rotating }
    effects:
      - { kind: set-actor-state, actorId: npc-the-loomwright, stateId: actorstate-loomwright-complete }
      - { kind: start-quiz, quizId: quiz-finished-rail, actorId: npc-the-loomwright }
    prompt: >-
      (You could ask the Loomwright to audit the despatch.)
    authoring:
      note: >-
        Presentational flip to `actorstate-loomwright-complete` (topic file §4); the
        state changes descriptions only. Scoped in-room to the Finished Rail; the
        rail's despatch gate itself belongs to the rooms card.

  - id: topic-loomwright-default
    actorId: npc-the-loomwright
    match: { kind: askTell, objectIds: [] }
    isActive: { kind: all, of: [] }
    responses:
      - >-
        The ledger is squared; your question is not registered yet. Ask me about a
        pattern — the shapes and the pseudo-code come first, then the demonstration.
      - >-
        The book accepts what the book accepts. Ask about the patterns, or the
        cousin's file; the carthen over there — a checked woollen blanket, folded at
        the rail for the long winter nights — is not on the record and never will
        be.
      - >-
        Mill matters are recorded matters. Ask me about a pattern, the shapes, or
        the licence paperwork, and you will have one clean answer.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask about a pattern.)

  # --- Threading Order: the Warp Dresser -------------------------------------
  - id: topic-warp-dresser-order
    actorId: npc-the-warp-dresser
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive: { kind: not, of: { kind: npc-knows, actorId: npc-the-warp-dresser, topicId: programming-constructs } }
    responses:
      - >-
        Sorry — sorry — the loom first. The dressing order — sequence, the spec's
        word for it — is a set of instructions processed one after another, each in
        the order the pattern says, never a step before the step before it. The warp
        is the cloth's long threads, dressed first and in order; the dressing order
        is the whole of the kindness I can show the loom. Have the order by heart,
        then ask me for the demonstration.
    strategy: { kind: once }
    effects:
      - { kind: learn-topic, actorId: npc-the-warp-dresser, topicId: programming-constructs }
    prompt: >-
      (You could ask for the demonstration, when you have the order.)

  - id: topic-warp-dresser-order-known
    actorId: npc-the-warp-dresser
    match: { kind: special, keywords: [next, order, sequence] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-threading-order }
        - { kind: npc-knows, actorId: npc-the-warp-dresser, topicId: programming-constructs }
        - { kind: not, of: { kind: flag-set, flag: threading-ordered } }
    responses:
      - >-
        Sequence, again — and I am glad of it, because this room is still lying.
        Every step of the cousin's shuffle is present; the order is wrong. The step
        hangers want re-hanging in the order the pattern says, one instruction
        after another. Give the loom its true order and the cloth will believe you
        again.
    strategy: { kind: rotating }
    effects: []
    prompt: >-
      (You could ask what to do next.)
    authoring:
      note: >-
        Keyword-addressed T2 AltTopic: after the teaching beat, while the room fix
        is undone, the beat is reachable as a `special` on [next, order, sequence]
        rather than by free text. It is no longer `askTell` because the `special`
        demonstration must not be shadowed once `isIdMatchingPhrase` is removed
        (npcs.md §3); the V4 trace does not ask this beat. Complement of
        `topic-warp-dresser-order`'s gate.

  - id: topic-warp-dresser-demonstration
    actorId: npc-the-warp-dresser
    match: { kind: special, keywords: [demonstration, demo, prove it, challenge] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-threading-order }
        - { kind: npc-knows, actorId: npc-the-warp-dresser, topicId: programming-constructs }
        - { kind: not, of: { kind: quiz-passed, quizId: quiz-threading-order } }
    responses:
      - >-
        Yes. The demonstration first; the apologies afterwards. Read the dressing
        order back to the loom — where the pattern says sequence, answer with what
        sequence means — and if the order holds, the Bureau's stamp travels with
        the demonstration and the sequence card is granted. I will wait. The loom
        will wait. Looms are patient about everything except order.
      - >-
        Whenever you are ready. Read the order, keep the order, and the record
        will accept you. Spend the attempt freely; the loom holds no grudge against
        trying.
    strategy: { kind: rotating }
    effects:
      - { kind: start-quiz, quizId: quiz-threading-order, actorId: npc-the-warp-dresser }
    prompt: >-
      (You could ask for the demonstration.)

  - id: topic-warp-dresser-mended
    actorId: npc-the-warp-dresser
    match: { kind: askTell, objectIds: [programming-constructs] }
    isActive:
      kind: all
      of:
        - { kind: in-room, roomId: room-threading-order }
        - { kind: npc-knows, actorId: npc-the-warp-dresser, topicId: programming-constructs }
        - { kind: flag-set, flag: threading-ordered }
    responses:
      - >-
        Look at it. Every hanger in the order the pattern says. Sequence is not a
        lesson here any more; it is a fact the loom can feel — the bobbins sign in,
        the heddles hold the threads that lift, the output prints at the end, each
        step after the one before. Sorry — sorry — I am talking over the loom.
        Thank you.
    strategy: { kind: once }
    effects:
      - { kind: set-actor-state, actorId: npc-the-warp-dresser, stateId: actorstate-warp-dresser-orderly }
    prompt: >-
      (You could ask how the cloth is dressing now.)

  - id: topic-warp-dresser-give
    actorId: npc-the-warp-dresser
    match: { kind: give, itemIds: [item-pattern-card-sequence] }
    isActive: { kind: has-item, itemId: item-pattern-card-sequence }
    responses:
      - >-
        Oh — the sequence card. Duly stamped and still warm from the demonstration.
        It files in the Order's box, under sequence, where the loom can consult it;
        so duly filed, thank you. Now the room can be dressed in the right order
        again, and I can start believing the step hangers.
    strategy: { kind: once }
    effects:
      - { kind: transfer-item, itemId: item-pattern-card-sequence, fromOwnerId: 'player', toOwnerId: npc-the-warp-dresser }
      - { kind: set-flag, flag: card-sequence-given, value: true }
      - kind: message
        text: >-
          The Warp Dresser files the pattern card for sequence in the Threading
          Order's box — sequence, the spec's word for the dressing order,
          instructions one after another — and the room can be dressed properly
          once more.
    prompt: >-
