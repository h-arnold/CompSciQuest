        selection card to the Colour Court, where the Shed Opener keeps her plates;
        the count card to the Weft Counter, where the Weft Tally keeps the passes;
        the condition card along the walk, to the Selvedge Warden. I am sorry to send
        you further. The loom would tell you the same.
    strategy: { kind: rotating }
